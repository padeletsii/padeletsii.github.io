<style>
:root{
  --blue:#0a0a0a; --blue2:#000000; --cream:#faf9f6; --paper:#ffffff;
  --gold:#f0bb3b; --tennis:#ccff00; --ink:#0a0a0a; --muted:#5b6066; --line:#e6e3dc;
  --green:#8fae0a; --red:#e0393f; --shadow:0 10px 28px rgba(0,0,0,.08);
  --admin:#0e7c86; --admin-light:#c9f1ef;
  --text:#0a0a0a; --text2:#444; --soft:#f1efe9; --bd:#0a0a0a;
  --border-strong:2px solid var(--bd); --radius-card:10px;
  --font-display:"Archivo",Inter,ui-sans-serif,system-ui,sans-serif;
  --font-head:"Archivo",Inter,ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--cream);color:var(--text)}
button,input,select{font:inherit}
header{background:linear-gradient(135deg,var(--blue2),var(--blue));color:white;padding:28px 22px 22px}
.wrap{max-width:1180px;margin:auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand-left{display:flex;align-items:center;gap:17px;min-width:0}

@media(max-width:700px){.brand-left{gap:10px}}
.brand h1{margin:0;font-size:clamp(28px,5vw,52px);letter-spacing:-.04em;line-height:.95}
.brand p{margin:8px 0 0;opacity:.78}
.badge{border:1px solid rgba(255,255,255,.35);padding:8px 12px;border-radius:999px;font-weight:800;font-size:12px;letter-spacing:.08em}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
nav button,.league-tabs button{border:0;border-radius:999px;padding:10px 15px;cursor:pointer;font-weight:800}
#nav button{background:rgba(255,255,255,.12);color:#fff}
#nav button.active{background:var(--paper);color:var(--text)}
.brand-right{display:flex;flex-direction:column;align-items:flex-end;gap:9px}
.profile-fab{display:inline-flex;align-items:center;gap:8px;border:1.5px solid rgba(255,255,255,.5);border-radius:999px;background:rgba(255,255,255,.14);color:#fff;padding:6px 14px 6px 6px;font-weight:900;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .15s ease}
.profile-fab:hover{background:rgba(255,255,255,.26)}
.profile-fab-avatar{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto}
.profile-fab.active{background:var(--paper);color:var(--text)}
.profile-fab.logged-in .profile-fab-avatar{background:var(--gold);color:var(--blue2);font-weight:950}
.profile-fab:not(.logged-in){background:var(--tennis);border-color:var(--tennis);color:var(--blue2);box-shadow:0 4px 14px -4px rgba(204,255,0,.65)}
.profile-fab:not(.logged-in):hover{filter:brightness(1.05);background:var(--tennis)}
.profile-fab:not(.logged-in) .profile-fab-avatar{background:rgba(13,55,111,.16)}
.profile-fab:not(.logged-in).active{background:var(--paper);color:var(--blue2);border-color:#fff;box-shadow:none}
@media(max-width:700px){.brand{flex-wrap:wrap;row-gap:14px}.brand-right{align-items:flex-start;width:100%}.profile-fab{padding:5px 12px 5px 5px;font-size:12.5px}.profile-fab-avatar{width:23px;height:23px}}
main{padding:24px 18px 70px}
.league-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.league-tabs button{background:var(--soft);color:var(--muted)}
.league-tabs button.active{background:var(--blue);color:#fff}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.panel-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;align-items:center}
.panel-head h2{margin:0;font-size:22px}
.panel-head small{color:var(--muted)}
.content{padding:20px 22px}
.notice{background:#fff6d9;border:1px solid #ead28d;border-radius:14px;padding:13px 15px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;min-width:720px}
.table-scroll{overflow:auto}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;padding:10px 9px;border-bottom:1px solid var(--line)}
th:nth-child(1),th:nth-child(2),td:nth-child(1),td:nth-child(2){text-align:left}
td{padding:12px 9px;border-bottom:1px solid var(--line);text-align:right}
tr:last-child td{border-bottom:0}
.rank{font-weight:900;width:44px}
.team{font-weight:800;cursor:pointer}
.team:hover{text-decoration:underline}
.team-link{appearance:none;border:0;background:transparent;color:inherit;padding:0;font:inherit;font-weight:800;text-align:left;cursor:pointer}
.team-link:hover{text-decoration:underline;color:var(--text)}
.team-link:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:3px}
.top3 .rank{color:var(--gold)}
.top8{background:rgba(22,79,158,.035)}
.journey-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:14px}
.journey{border:0;background:none;padding:0}
.journey h3{margin:0 0 12px;color:var(--text);font-size:16px}
.match{padding:13px 14px 11px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--paper);position:relative;transition:box-shadow .15s ease,border-color .15s ease}
.match:last-child{margin-bottom:0}
.match:hover{box-shadow:0 6px 18px rgba(20,40,70,.08);border-color:#cfd7e4}
.match-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:20px;margin-bottom:6px}
.match-head-when{min-width:0;overflow:hidden}
.match-head-when .muted{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.match-status{flex:0 0 auto;font-size:9px;font-weight:900;letter-spacing:.4px;padding:3px 8px;border-radius:999px;text-transform:uppercase}
.match-status.is-played{background:#e8f5ee;color:#17603a}
.match-status.is-pending{background:var(--soft);color:var(--muted)}
.match-teams{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.match-team{display:flex;align-items:flex-start;gap:6px;min-width:0}
.match-team-away{flex-direction:row-reverse;text-align:right}
.match-avatar{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:900;letter-spacing:.2px}
.match-team-name{font-weight:700;font-size:12.5px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;word-break:break-word;color:var(--text);padding-top:2px}
.match-team.is-winner .match-avatar{background:linear-gradient(135deg,var(--tennis),#a8c419);color:var(--blue2)}
.match-team.is-winner .match-team-name{color:var(--text);font-weight:900}
.match-team.is-loser .match-team-name{color:var(--muted);font-weight:600}
.match-score{font-weight:950;font-size:14px;text-align:center;min-width:40px;padding:5px 5px;border-radius:8px;white-space:nowrap;align-self:center}
.match-score.played{color:var(--text);background:var(--soft)}
.match-score.pending{color:var(--muted);font-size:11px;font-weight:900;letter-spacing:.4px;background:var(--soft)}
.pending{color:var(--muted);font-weight:700}
.played{color:var(--text)}
.match-actions{margin-top:9px;display:flex;justify-content:flex-end}

/* ============================================================================
   ===== Rediseño "cartel" (lima + negro, tipografía Archivo, bordes bold) =====
   ============================================================================ */
body{font-family:var(--font-display),Inter,ui-sans-serif,system-ui,sans-serif}
.brand h1{font-family:var(--font-head);font-weight:900;text-transform:uppercase}
header{border-bottom:5px solid var(--tennis)}
.badge{font-family:var(--font-display)}

/* Pestañas de liga / nav: pastillas con borde negro, activo en lima */
.league-tabs button{border:2px solid var(--bd);background:var(--paper);color:var(--text);font-family:var(--font-display)}
.league-tabs button.active{background:var(--tennis);color:var(--text);border-color:var(--bd)}
.stats-period button{border:2px solid var(--bd)}
.stats-period button.active{background:var(--tennis);color:var(--text);border-color:var(--bd)}

/* Tarjetas y paneles: borde negro grueso, esquinas casi rectas, sin sombra difusa */
.panel,.card,.info-card,.info-map,.stat-card,.profile-stat,.profile-card,
.rival-card,.set-box,.auth-choice-btn,.auth-player-btn,.pf-next,.contact-search-box,
.contact-finder,.admin-round-box,.user-summary>div,.proposal-card,.match,
.profile-match,.pf-match-row,.slot,.position-box{
  border:var(--border-strong)!important;border-radius:var(--radius-card)!important;box-shadow:none!important
}
.journey{border:0!important;background:none!important;box-shadow:none!important}
.modal-card{border:var(--border-strong)!important;border-radius:var(--radius-card)!important}

/* Cabeceras de tabla: barra negra, texto blanco, mayúsculas (ya lo eran) */
table th{background:var(--ink);color:#fff;border-bottom:2px solid var(--bd)}
table th:first-child{border-top-left-radius:6px}
table th:last-child{border-top-right-radius:6px}

/* Titulares de sección: Archivo, negrita, mayúsculas */
.panel-head h2,.info-card h3,.card h3,.team-profile-head h3,.journey h3,
.player-auth-head h3,.login-private h3,.profile-login-card h3{
  font-family:var(--font-head);font-weight:900;text-transform:uppercase;letter-spacing:-.01em
}

/* Botones principales: esquinas rectas, negrita Archivo */
.primary,.secondary,.danger,.admin-btn,.adminbar button,button.login-main-btn,
.profile-login-enter,.match-share,.auth-choice-btn{font-family:var(--font-display);font-weight:800}

/* El icono del menú inferior mantiene el azul que ya elegiste (no lo tiñe el negro nuevo) */
.bn-icon-wrap svg .bn-stroke{stroke:#164f9e}

/* Cabecera de "mi perfil" y banner de jornada actual: degradado en negro puro */
.pf-hero{background:linear-gradient(135deg,#000,#1a1a1a)}
.whatsapp-banner a{background:var(--ink);border-color:var(--bd)}

/* Inputs con borde negro, a juego con el resto de la interfaz */
.field input,.field select,.player-auth-box input,.player-auth-box select,
.set-score-row input,.contact-finder select,.result-proposal-form select,
.admin-round-actions select{border:2px solid var(--bd)!important}

@media(max-width:700px){
  .panel,.card,.info-card,.match,.profile-match,.pf-match-row{border-width:1.5px!important}
}

/* ============================================================================
   ===== Más verde, menos negro: la cabecera y las superficies grandes pasan
   a lima, y el negro queda para bordes, texto y algún acento puntual. =========
   ============================================================================ */
header{background:var(--tennis);color:var(--text)}
header .brand p{color:var(--text);opacity:.72}
.badge{border-color:rgba(10,10,10,.35);color:var(--text)}
#nav button{background:rgba(10,10,10,.08);color:var(--text)}
#nav button.active{background:var(--ink);color:var(--tennis)}
.profile-fab{border-color:rgba(10,10,10,.4);background:rgba(10,10,10,.08);color:var(--text)}
.profile-fab:hover{background:rgba(10,10,10,.16)}
.profile-fab-avatar{background:rgba(10,10,10,.14)}
.profile-fab.active{background:var(--paper);color:var(--text)}
.profile-fab:not(.logged-in){background:var(--ink);border-color:var(--bd);color:var(--tennis);box-shadow:none}
.profile-fab:not(.logged-in):hover{filter:none;background:#1a1a1a}
.profile-fab:not(.logged-in) .profile-fab-avatar{background:rgba(255,255,255,.16)}
.profile-fab:not(.logged-in).active{background:var(--paper);color:var(--text);border-color:#fff}

/* Cabeceras de tabla y banners grandes: lima en vez de negro */
table th{background:var(--tennis);color:var(--text)}
.current-round-banner{background:var(--tennis);color:var(--text)}

/* Botones principales: relleno lima con borde y texto negro */
.primary{background:var(--tennis)!important;color:var(--text)!important;border:2px solid var(--bd)!important}
.admin-btn{background:var(--tennis);color:var(--text)}
.profile-login-enter,.login-private .login-main-btn{background:var(--tennis)!important;color:var(--text)!important;border:2px solid var(--bd)!important}
.whatsapp-banner a{background:var(--tennis);color:var(--text);border-color:var(--bd)}

/* Cabecera de "Mi perfil": también en lima, texto negro */
.pf-hero{background:linear-gradient(135deg,var(--tennis),#eeffb0);color:var(--text)}
.pf-avatar{background:rgba(10,10,10,.08);border-color:rgba(10,10,10,.35)}
.pf-hero-info h3,.pf-hero-team{color:var(--text)}
.pf-hero-league{background:rgba(10,10,10,.1);color:var(--text)}
.pf-hero-actions button{border-color:rgba(10,10,10,.4);background:rgba(10,10,10,.06);color:var(--text)}
.pf-hero-actions button:hover{background:rgba(10,10,10,.14)}

   ===== Liga de Tenis: mantiene su naranja-rojizo propio, no se tiñe de lima =
   ============================================================================ */

body.tennis-theme .profile-fab.active{background:var(--paper);color:#e8600a}

body.tennis-theme .profile-fab:not(.logged-in):hover{background:var(--soft)}
body.tennis-theme .profile-fab:not(.logged-in) .profile-fab-avatar{background:rgba(165,59,39,.14)}
body.tennis-theme .profile-fab:not(.logged-in).active{background:var(--paper);color:#e8600a;border-color:#fff}
body.tennis-theme table th{background:#e8600a;color:#fff}
body.tennis-theme .current-round-banner{background:#e8600a;color:#fff}
body.tennis-theme .primary{background:#e8600a!important;color:#fff!important;border-color:#e8600a!important}

/* ============================================================================
   ===== Dinamismo: micro-interacciones, transiciones y animaciones ==========
   ============================================================================ */

/* El contenido aparece con un suave "fade + sube" cada vez que cambia:
   al cambiar de pestaña, de jornada, o al llegar datos nuevos del servidor. */
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.table-scroll,.match,.profile-match,.pf-match-row,.info-card,.journey,.notice,
.tennis-note,.standings-note,.teams-grid,.cup-bracket,.proposal-card,.user-summary,
.contact-finder,.rival-card{animation:fadeInUp .35s ease}

/* Efecto "cartel": tarjetas y paneles se levantan y sacan sombra dura negra al pasar el ratón */
.panel,.card,.journey,.info-card,.info-map,.stat-card,.profile-stat,.profile-card,
.rival-card,.match,.profile-match,.pf-match-row,.proposal-card{
  transition:transform .15s ease,box-shadow .15s ease
}
.panel:hover,.card:hover,.info-card:hover,.stat-card:hover,.profile-stat:hover,
.rival-card:hover,.match:hover,.profile-match:hover,.proposal-card:hover{
  transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--ink)!important
}

/* Botones: mismo efecto "pop" al pasar el ratón, y rebote hacia dentro al pulsar */
.primary,.secondary,.admin-btn,.league-tabs button,.stats-period button,
nav button,.bottom-nav button,.profile-fab,.match-share,.auth-choice-btn,
.auth-player-btn,button.login-main-btn,.profile-login-enter{
  transition:transform .15s ease,box-shadow .15s ease,background-color .15s ease,color .15s ease
}
.primary:hover,.admin-btn:hover,.league-tabs button:hover,.stats-period button:hover,
.match-share:hover,.auth-choice-btn:hover,.auth-player-btn:hover,
button.login-main-btn:hover,.profile-login-enter:hover{
  transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--ink)
}
.primary:active,.admin-btn:active,.league-tabs button:active,.stats-period button:active,
.match-share:active,.auth-choice-btn:active,.auth-player-btn:active,
button.login-main-btn:active,.profile-login-enter:active{
  transform:translate(0,0)!important;box-shadow:none!important
}
.league-tabs button.active{transform:scale(1.04)}

/* Filas de la clasificación: resaltado suave al pasar el ratón */
table tbody tr{transition:background-color .12s ease}
table tbody tr:hover td{background:rgba(10,10,10,.05)}
body.tennis-theme table tbody tr:hover td{background:rgba(232,96,10,.08)}

/* El punto de "Actualizado" respira suavemente mientras hay conexión, como señal de vida */
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(1.35)}}
.sync-status.ok::before{animation:pulseDot 1.8s ease-in-out infinite}

/* Las ventanas emergentes entran con un ligero rebote en vez de aparecer secas */
@keyframes modalPop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes backdropFade{from{opacity:0}to{opacity:1}}
.modal.open{animation:backdropFade .18s ease}
.modal.open .modal-card{animation:modalPop .28s cubic-bezier(.2,.9,.3,1.2)}

/* El icono del menú inferior da un pequeño rebote al seleccionarlo */
@keyframes navBounce{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.bottom-nav button.active .bn-icon-wrap{animation:navBounce .3s ease}

/* Respeta a quien prefiere sin animaciones (accesibilidad) */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}





/* ============================================================================
   ===== Un toque de marca en el top 8 y el podio, sin sobrecargar ===========
   ============================================================================ */

/* ================= MODO OSCURO ================= */
html.dark{color-scheme:dark;
  --cream:#0f1011; --paper:#1a1c1f; --soft:#25282c; --line:#2f3338; --muted:#a3a9b0;
  --text:#f2f2ee; --text2:#cfd3d8; --bd:#4a4f56; --border-strong:2px solid #4a4f56;
  --shadow:0 10px 28px rgba(0,0,0,.45)}
html.dark body{background:var(--cream);color:var(--text)}
html,body{transition:background-color .35s ease,color .35s ease}
.card,.match,.journey,.panel,.modal-card,.info-card,.livenow-panel,.livenow-match,.team-card,.proposal-card{transition:background-color .35s ease,border-color .35s ease}
html.dark input,html.dark select,html.dark textarea{background:var(--paper);color:var(--text);border-color:var(--line)}
html.dark ::placeholder{color:#7d838a}
html.dark .sub-tabs{background:var(--soft)}html.dark .sub-tabs button.active{background:var(--paper);color:var(--text)}
html.dark .chip-mini,html.dark .file-btn{background:var(--soft);color:var(--text);border-color:var(--line)}
html.dark .toast{background:#f2f2ee;color:#0a0a0a}
html.dark .modal-card{background:var(--paper);color:var(--text)}
html.dark #nav button.active,html.dark .chip.active{background:var(--tennis);color:#0a0a0a}
html.dark .skel-line,html.dark .sk{background:#2a2d31}
html.dark .new-badge{background:#12301f;color:#7be0a4;border-color:#1f5a38}
html.dark .match-score.pending{background:var(--soft)}
html.dark img.logo-inv{filter:invert(1)}
.theme-toggle{border:1.5px solid rgba(255,255,255,.5);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;width:38px;height:38px;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:transform .25s ease,background .2s}
.brand-tools .theme-toggle{width:auto;min-width:38px;padding:0 12px;font-size:13px;font-weight:800;gap:4px}
.theme-toggle:hover{background:rgba(255,255,255,.26)}.theme-toggle:active{transform:rotate(25deg) scale(.92)}

/* ================= TRANSICIONES / MOVIMIENTO ================= */
@keyframes enterR{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes enterL{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes enterUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.enter-r{animation:enterR .32s cubic-bezier(.2,.8,.2,1) both}
.enter-l{animation:enterL .32s cubic-bezier(.2,.8,.2,1) both}
.enter-up{animation:enterUp .4s cubic-bezier(.2,.8,.2,1) both}
/* clasificación animada */
table tbody tr.st-enter{animation:enterUp .5s cubic-bezier(.2,.8,.2,1) both}
table tbody tr.st-flash{animation:stFlash 1.4s ease}
@keyframes stFlash{0%{background:rgba(204,255,0,.55)}100%{background:transparent}}
.mv{display:inline-block;font-size:10px;font-weight:900;margin-left:4px;vertical-align:middle}
.mv.up{color:#17803d}.mv.down{color:#c23b3b}
html.dark .mv.up{color:#6ee79a}html.dark .mv.down{color:#ff8a8a}
/* skeleton */
.sk{position:relative;overflow:hidden;background:#e9e6dc;border-radius:8px}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:skShimmer 1.3s infinite}
html.dark .sk::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent)}
@keyframes skShimmer{to{transform:translateX(100%)}}
.sk-card{border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--paper);margin-bottom:9px}
.sk-line{height:12px;margin:7px 0}.sk-top{display:flex;gap:10px;align-items:center}.sk-dot{width:34px;height:34px;border-radius:50%;flex:none}
/* micro-interacciones */
.match,.team-card,.livenow-match,.dir-card,.am-card,.inv-row,.profile-stat{transition:transform .15s ease,box-shadow .15s ease,border-color .2s}
@media(hover:hover){.match:hover,.team-card:hover,.livenow-match:hover,.dir-card:hover,.am-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.1)}}
.match:active,.team-card:active,.livenow-match:active,.dir-card:active,.am-card:active{transform:scale(.978);box-shadow:none}
button{transition:transform .12s ease,background-color .2s,box-shadow .2s}
button:active:not(:disabled){transform:scale(.96)}
.whatsapp-banner a{position:relative}
.whatsapp-banner a::before{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 0 rgba(204,255,0,.5);animation:waPulse 2.4s infinite;pointer-events:none}
@keyframes waPulse{0%{box-shadow:0 0 0 0 rgba(204,255,0,.5)}70%{box-shadow:0 0 0 14px rgba(204,255,0,0)}100%{box-shadow:0 0 0 0 rgba(204,255,0,0)}}
.rip-host{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:rgba(128,128,128,.28);transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(4);opacity:0}}
/* próximo partido + cuenta atrás */
.next-hero{background:#0a0a0a;color:#fff;border-radius:16px;padding:16px 18px;margin:0 0 14px;position:relative;overflow:hidden}
.next-hero::after{content:"";position:absolute;inset:0;background:radial-gradient(200px 140px at 95% -10%,rgba(204,255,0,.22),transparent 60%);pointer-events:none}
.next-hero .k{font-size:11px;font-weight:900;letter-spacing:.1em;color:var(--tennis)}
.next-hero .vs{font-size:20px;font-weight:900;margin:8px 0 2px;letter-spacing:-.01em}
.next-hero .vs .team-link{color:#fff}
.next-hero .when{opacity:.72;font-size:13px}
.cd{display:flex;gap:8px;margin-top:14px}
.cd div{background:rgba(255,255,255,.1);border-radius:12px;padding:9px 12px;text-align:center;min-width:62px}
.cd b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.cd small{font-size:10px;opacity:.65;letter-spacing:.06em;text-transform:uppercase}
.live-now-tag{display:flex;align-items:center;gap:8px;margin-top:14px;font-weight:900;color:#b7e300}
.live-now-tag i{width:10px;height:10px;border-radius:50%;background:#b7e300;animation:blinkDot 1.2s infinite}
@keyframes blinkDot{50%{opacity:.25;transform:scale(.75)}}
html.dark .next-hero{background:#000;border:1px solid #2f3338}
/* cuadro de la copa */
.bracket-wrap{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper)}
.bracket-wrap{overflow-x:auto}.br-svg{width:100%;min-width:560px;height:auto;display:block}
.br-svg .box{fill:var(--paper);stroke:var(--bd);stroke-width:2}
.br-svg .box.win{fill:#ecffb0}
html.dark .br-svg .box.win{fill:#33400a}
.br-svg text{font:800 13.5px Archivo,Inter,sans-serif;fill:var(--text)}
.br-svg .lbl{font-size:11px;fill:var(--muted);letter-spacing:.08em}
.br-svg .tbd{fill:var(--muted);font-weight:700}
.br-svg path{fill:none;stroke:var(--bd);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.br-svg .ln{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset .8s ease}
.br-svg.drawn .ln{stroke-dashoffset:0}
.br-svg .tm{opacity:0;transform:translateY(5px);transition:opacity .5s ease .5s,transform .5s ease .5s}
.br-svg.drawn .tm{opacity:1;transform:none}
/* compartir */
.share-btn{display:inline-flex;gap:8px;align-items:center;border:2px solid var(--bd);background:var(--paper);color:var(--text);border-radius:999px;padding:9px 16px;font-weight:900;font-size:13px;cursor:pointer;margin:0 0 12px}

/* instalar app */
.install-bar{position:fixed;left:12px;right:12px;bottom:84px;z-index:350;background:#0a0a0a;color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 34px rgba(0,0,0,.35);max-width:520px;margin:0 auto;animation:enterUp .45s cubic-bezier(.2,.8,.2,1) both}

.install-bar .ib-x{border:0;background:transparent;color:#fff;opacity:.6;font-size:18px;cursor:pointer;padding:4px 6px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---- clasificación en móvil: puntos primero ---- */

 .st-table th:nth-child(n+6):not(:last-child),.st-table td:nth-child(n+6):not(:last-child){display:none}
 .st-table th:first-child,.st-table td:first-child{order:1}
 .st-table th:last-child,.st-table td:last-child{order:2}

 .st-table th:nth-child(3),.st-table td:nth-child(3){order:4}

 .st-table th:nth-child(5),.st-table td:nth-child(5){order:6}

 .st-table td:last-child{padding:6px 0}

<style id="identidad-etsii">
/* =====================================================================
   IDENTIDAD LIGAS ETSII — capa visual nueva.
   Va DESPUÉS de todo el CSS original: no toca la lógica ni los datos,
   solo cambia el aspecto. Cada categoría tiene sus colores (los del logo):
   rosa = femenina · morado+verde = mixta · azul = masculina ·
   tenis = morado+lima · azul+amarillo = genérico (inicio, amistosos…).
   ===================================================================== */
@property --c1 { syntax: '<color>'; inherits: true; initial-value: #1E5BD8; }
@property --c2 { syntax: '<color>'; inherits: true; initial-value: #F2B82E; }
@property --c3 { syntax: '<color>'; inherits: true; initial-value: #0C2A6B; }

html[data-cat] { transition: --c1 .9s cubic-bezier(.16,1,.3,1), --c2 .9s cubic-bezier(.16,1,.3,1), --c3 .9s cubic-bezier(.16,1,.3,1); }
html[data-cat="padel"], [data-lc="padel"] { --c1:#1a1a1a; --c2:#CCFF00; --c3:#0a0a0a; --emb:url("identidad/padel.webp"); }
html[data-cat="tenis"], [data-lc="tenis"] { --c1:#F06A12; --c2:#CCFF00; --c3:#C24A00; --emb:url("identidad/tenis-o.webp"); }
[data-lc] { --acc: var(--c1); }
html.dark [data-lc] { --acc: var(--c2); }

/* ---- tokens: se reaprovechan las variables que ya usa toda la web ---- */
html[data-cat] {
  --acc: var(--c1);
  --tennis: var(--c2); --gold: var(--c2); --green: var(--acc);
  --blue: var(--c3); --blue2: var(--c3); --ink: #15131c; --admin: var(--c3);
  --cream: #F4F3EF; --paper: #FFFFFF; --soft: #EFEEE9; --line: #E2E0D8; --muted: #66636f;
  --text: #16141d; --text2: #3f3d47; --bd: #E2E0D8;
  --border-strong: 1px solid var(--line); --radius-card: 16px;
  --shadow: 0 14px 34px -22px rgba(20, 16, 40, .45);

  content: ""; position: fixed; z-index: -1; pointer-events: none; left: 50%; top: -380px; width: 760px; height: 760px; margin-left: -380px;

  animation: idSpin 48s linear infinite;
}
@keyframes idSpin { to { transform: rotate(360deg); } }

/* ---------------- Cabecera ---------------- */

  position: relative; overflow: hidden; color: #fff !important; border-bottom: 0 !important;
  background: linear-gradient(135deg, var(--c3) 0%, var(--c1) 100%) !important;
  padding: 20px 22px 18px;
}

  content: ""; position: absolute; right: -70px; top: -90px; width: 340px; height: 340px; pointer-events: none;
  background: var(--emb) center / contain no-repeat; opacity: .16; transform: rotate(-12deg); transition: opacity .5s;

/* logo construido por piezas */
.id-emblem { position: relative; width: 66px; height: 66px; flex: 0 0 66px; cursor: pointer; filter: drop-shadow(0 6px 14px rgba(0,0,0,.25)); }
.id-emblem .sl { position: absolute; inset: 0; }
.id-emblem .sl i { position: absolute; inset: 0; background-size: 100% 100%; clip-path: var(--clip); transition: transform .8s cubic-bezier(.16,1,.3,1), opacity .55s, filter .55s; transition-delay: var(--delay, 0ms); }
.id-emblem.scatter .sl i { transform: translate(var(--tx), var(--ty)) rotate(var(--r)) scale(.9); opacity: 0; filter: blur(2px); }
.id-emblem.exit .sl i { transition-timing-function: cubic-bezier(.7,0,.84,0); transition-duration: .38s; transition-delay: calc(var(--delay) * .3); transform: translate(calc(var(--tx) * -.6), calc(var(--ty) * -.6)) rotate(calc(var(--r) * -1)) scale(1.05); opacity: 0; }
.id-emblem.instant .sl i { transition: none; }
.id-emblem .ball { position: absolute; z-index: 3; left: calc(var(--bx) - 7.02%); top: calc(var(--by) - 7.02%); width: 14.04%; height: 14.04%; }
.id-emblem .ball img { width: 100%; height: 100%; display: block; }
.id-emblem .ball.gone { opacity: 0; }
.id-emblem .ball.drop { animation: idDrop 1s cubic-bezier(.16,1,.3,1) both; }
@keyframes idDrop {
  0% { transform: translateY(-320%) rotate(-220deg); opacity: 0; animation-timing-function: cubic-bezier(.5,0,1,.6); }
  12% { opacity: 1; }
  45% { transform: translateY(0) scale(1.1,.86); animation-timing-function: cubic-bezier(0,.5,.4,1); }
  66% { transform: translateY(-50%) rotate(20deg); animation-timing-function: cubic-bezier(.6,0,1,.7); }
  82% { transform: translateY(0) scale(1.05,.95); }
  100% { transform: none; opacity: 1; }
}
.id-flood { position: fixed; inset: 0; z-index: 400; pointer-events: none; background: var(--c1); opacity: 0; }
.id-flood.go { animation: idFlood .7s cubic-bezier(.16,1,.3,1) forwards; }
@keyframes idFlood { 0% { clip-path: circle(0 at var(--fx) var(--fy)); opacity: .45; } 100% { clip-path: circle(150vmax at var(--fx) var(--fy)); opacity: 0; } }

function roundRobin(teams){
  let a=teams.map(t=>t.team);
  if(a.length%2) a.push("DESCANSA");
  const n=a.length, rounds=[];
  let arr=[...a];
  for(let r=0;r<n-1;r++){
    let ms=[];
    for(let i=0;i<n/2;i++){
      let x=arr[i], y=arr[n-1-i];
      if(x!=="DESCANSA" && y!=="DESCANSA"){
        if(r%2===0) ms.push({home:x,away:y}); else ms.push({home:y,away:x});
      }
    }
    rounds.push(ms);
    arr=[arr[0],arr[n-1],...arr.slice(1,n-1)];
  }
  return rounds;
}
function initDB(){
  const d=deepClone(INITIAL);
  for(const [key,L] of Object.entries(d.leagues)){
    L.results={};
    if(L.complete){
      if(key==="media"){
        // Malaquito de memphis y Yisus y el golden boy se apuntaron después de fijar
        // y publicar la Jornada 1. Insertamos los 2 equipos nuevos en mitad de la
        // lista de los 14 de toda la vida y regeneramos el round-robin completo:
        // esto mantiene los 7 partidos de la Jornada 1 exactamente igual (solo se
        // añade el cruce entre los 2 equipos nuevos como partido extra de esa misma
        // jornada) y regenera correctamente el resto de jornadas para que los 16
        // equipos jueguen todos contra todos.
        const orig=L.teams.slice(0,14), nuevos=L.teams.slice(14);
        if(nuevos.length===2){
          const reordered=[...orig.slice(0,7), nuevos[0], nuevos[1], ...orig.slice(7)];
          L.schedule=roundRobin(reordered);
        } else {
          L.schedule=roundRobin(orig);
        }
      } else if(key==="fem"){
        // poteito potato (antes Martibea) y AniDani se apuntaron después de fijar y publicar la
        // Jornada 1 de femenina (con "Pareja pendiente" incluida como hueco).
        // Mismo truco que en media: insertamos los 2 equipos nuevos en mitad
        // de la lista de los 12 de toda la vida para que los 6 partidos de la
        // Jornada 1 queden exactamente igual (solo se añade el cruce entre las
        // 2 parejas nuevas como partido extra de esa misma jornada).
        const orig=L.teams.slice(0,12), nuevos=L.teams.slice(12);
        if(nuevos.length===2){
          const reordered=[...orig.slice(0,6), nuevos[0], nuevos[1], ...orig.slice(6)];
          L.schedule=roundRobin(reordered);
        } else {
          L.schedule=roundRobin(orig);
        }
      } else {
        L.schedule=roundRobin(L.teams);
      }
    }else L.schedule=[];
  }
  return d;
}
function setSync(ok,text){

function apiReady(){return API_URL && !API_URL.includes("PEGA_AQUI")}
let cloudLoadInFlight=false;
async function loadCloudResults(){
  if(!apiReady()){setSync(false,"Falta conectar");render();return}
  // Si ya hay una petición en marcha (por ejemplo el refresco automático de 30s
  // solapándose con una recarga manual), no lanzamos otra por encima: así nunca
  // se acumulan peticiones y "Actualizando…" no se queda colgado por eso.
  if(cloudLoadInFlight) return;
  cloudLoadInFlight=true;
  const ctrl=new AbortController();
  const killTimer=setTimeout(()=>ctrl.abort(),15000);
  try{
    setSync(false,"Actualizando…");
    const r=await fetch(API_URL+"?action=state&t="+Date.now(),{cache:"no-store",signal:ctrl.signal,headers:SUPABASE_HEADERS});
    const data=await r.json();
    if(!data.ok) throw new Error(data.error||"Error");
    for(const L of Object.values(db.leagues)) L.results={};

    const incoming=data.results||[];
    if(data.currentRounds) currentRounds=Object.assign(currentRounds,data.currentRounds);

    // Primero cargamos las claves antiguas (0-1, 1-2, etc.) y las traducimos
    // a la identidad real del partido según el calendario actual.
    incoming.forEach(x=>{
      const L=db.leagues[x.league];
      if(!L) return;
      const mm=String(x.key||"").match(/^(\d+)-(\d+)$/);
      if(mm){
        const r=Number(mm[1]), i=Number(mm[2]);
        const match=L.schedule?.[r]?.[i];
        if(match){
          const k=stableMatchKey(match.home,match.away);
          L.results[k]={sets:x.sets||[],winner:x.winner};
        }
      }
    });

    // Después cargamos las claves permanentes. Si un partido ya fue migrado,
    // la versión nueva prevalece sobre la antigua.
    incoming.forEach(x=>{
      const L=db.leagues[x.league];
      if(!L) return;
      if(String(x.key||"").startsWith("v2:")){
        L.results[x.key]={sets:x.sets||[],winner:x.winner};
      }
    });

    // Horario de partidos (fecha, hora, pista), importado por la administradora
    // desde el panel de administración sin tocar el código fuente.
    matchSchedule={};
    (data.schedule||[]).forEach(x=>{
      if(!x||!x.league||!x.home||!x.away) return;
      const home=resolveTeamName(x.league,x.home), away=resolveTeamName(x.league,x.away);
      matchSchedule[scheduleMapKey(x.league,home,away)]={date:x.date||"",time:x.time||"",court:x.court||"",jornada:x.jornada||0};
    });
    registerNameSuggestionsForSchedule(data.schedule||[]);
    renderNameSuggestions();
    friendlies=data.friendlies||[];
    promoBanner=data.promo||promoBanner;
    renderPromoBanner();
    setSync(true,"Actualizado");
    cloudReady=true;
    render();
  }catch(e){
    console.error(e);
    if(!cloudReady){cloudReady=true;render();}
    setSync(false,e.name==="AbortError"?"Tardó demasiado, reintentando…":"Sin conexión");
  }finally{
    clearTimeout(killTimer);
    cloudLoadInFlight=false;
  }
}
async function cloudWrite(payload){
  if(!apiReady()) throw new Error("La web todavía no está conectada al backend.");
  const body=new URLSearchParams();
  Object.entries(payload).forEach(([k,v])=>body.append(k,typeof v==="string"?v:JSON.stringify(v)));
  const ctrl=new AbortController();
  const killTimer=setTimeout(()=>ctrl.abort(),25000);
  try{
    const r=await fetch(API_URL,{method:"POST",body,signal:ctrl.signal,headers:SUPABASE_HEADERS});
    const data=await r.json();
    if(!data.ok) throw new Error(data.error||"No se pudo guardar");
    return data;
  }catch(e){
    if(e.name==="AbortError") throw new Error("El servidor está tardando demasiado en responder. Inténtalo de nuevo.");
    throw e;
  }finally{
    clearTimeout(killTimer);
  }
}

function stableMatchKey(home,away){
  // La clave no depende de la jornada ni del orden visual del calendario.
  // Ordenamos los nombres para que A-vs-B y B-vs-A sean el mismo partido.
  const pair=[String(home),String(away)].sort((a,b)=>a.localeCompare(b,"es",{sensitivity:"base"}));
  return "v2:"+encodeURIComponent(pair[0])+"||"+encodeURIComponent(pair[1]);

// Normaliza un nombre de pareja/equipo para poder reconocerlo aunque venga con

function normalizeTeamName(s){
  return String(s||"")
    .normalize("NFD").replace(/[̀-ͯ]/g,"")
    .toLowerCase()
    .replace(/^(los|las|el|la)\s+/,"")
    .replace(/[^a-z0-9]/g,"");

let _teamNameLookupCache=null;
function teamNameLookup(){

  // cada vez que cambian las ligas (o la primera vez que hace falta).
  if(_teamNameLookupCache) return _teamNameLookupCache;
  const map={};
  Object.entries(db.leagues).forEach(([k,L])=>{
    const byNorm={};
    L.teams.forEach(t=>{
      const n=normalizeTeamName(t.team);
      if(!(n in byNorm)) byNorm[n]=t.team; // si hay colisión, se queda el primero

  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      const cost=a[i-1]===b[j-1]?0:1;
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+cost);
    }
    prev=cur;
  }
  return prev[n];
}
// Busca, dentro de una liga, si un nombre "raro" se parece mucho a una única
// pareja ya inscrita (y solo a esa: si hay dos parejas igual de parecidas no
// sugerimos nada, para no liarla). No la da por buena sola: solo la propone.
function findSimilarTeam(league,name){
  const L=db.leagues[league]; if(!L) return null;
  const n=normalizeTeamName(name);
  if(!n) return null;
  let best=null,bestDist=Infinity,secondDist=Infinity;
  L.teams.forEach(t=>{
    const d=levenshtein(n,normalizeTeamName(t.team));
    if(d<bestDist){ secondDist=bestDist; bestDist=d; best=t.team; }
    else if(d<secondDist){ secondDist=d; }
  });
  const threshold=n.length<=4?1:2;
  if(best && bestDist>0 && bestDist<=threshold && secondDist>bestDist) return {team:best,distance:bestDist};
  return null;
}

let pendingNameSuggestions=[];
let dismissedNameSuggestions={};
function registerNameSuggestionsForSchedule(entries){
  pendingNameSuggestions=[];
  const seen=new Set();
  (entries||[]).forEach(x=>{
    if(!x||!x.league) return;
    const L=db.leagues[x.league]; if(!L) return;
    [x.home,x.away].forEach(raw=>{
      if(!raw) return;
      if(L.teams.some(t=>t.team===raw)) return; // coincide tal cual
      const aliasKey=x.league+"|"+normalizeTeamName(raw);
      if(teamAliasOverrides[aliasKey]) return; // ya confirmado antes
      if(teamNameLookup()[x.league]?.[normalizeTeamName(raw)]) return; // se resolvió solo
      const sim=findSimilarTeam(x.league,raw);
      if(!sim) return;
      const dedupeKey=x.league+"|"+normalizeTeamName(raw)+"|"+sim.team;
      if(dismissedNameSuggestions[dedupeKey]) return;
      if(seen.has(dedupeKey)) return;
      seen.add(dedupeKey);
      pendingNameSuggestions.push({league:x.league,leagueName:L.name,typo:raw,suggested:sim.team});
    });
  });
}

function daysDiffFromToday(iso){
  const mm=String(iso||"").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!mm) return null;
  const target=new Date(Number(mm[1]),Number(mm[2])-1,Number(mm[3])); target.setHours(0,0,0,0);
  const today=new Date(); today.setHours(0,0,0,0);
  return Math.round((target-today)/86400000);
}
function relativeDayLabel(iso){
  const diff=daysDiffFromToday(iso);
  if(diff===null) return "";

  if(diff===1) return "Mañana";
  if(diff===2) return "Pasado mañana";
  return formatMatchDate(iso);
}
function minutesNow(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function minutesFromHHMM(hhmm){
  const mm=String(hhmm||"").match(/^(\d{1,2}):(\d{2})$/);
  if(!mm) return null;
  return Number(mm[1])*60+Number(mm[2]);
}
// Duración estimada de un partido, para saber si "se está jugando ahora mismo".
const MATCH_DURATION_MIN=120;
function matchLiveStatus(dateISO,time){
  if(daysDiffFromToday(dateISO)!==0) return null;
  const start=minutesFromHHMM(time);
  if(start===null) return "today-unknown";
  const now=minutesNow();
  if(now>=start && now<start+MATCH_DURATION_MIN) return "live";
  if(now<start) return "today-upcoming";
  return "today-past";
}

}

function calcStandings(L){
  let rows={};
  L.teams.forEach(t=>rows[t.team]={team:t.team,pj:0,pg:0,pp:0,pts:0,sf:0,sc:0,jf:0,jc:0});
  (L.schedule||[]).forEach((round,r)=>round.forEach((m,i)=>{
    const res=getResult(L,r,i); if(!res||!res.winner)return;
    let A=rows[m.home],B=rows[m.away]; A.pj++;B.pj++;
    let as=0,bs=0,ag=0,bg=0;
    (res.sets||[]).forEach(s=>{let x=Number(s[0]),y=Number(s[1]);if(Number.isFinite(x)&&Number.isFinite(y)){ag+=x;bg+=y;if(x>y)as++;else if(y>x)bs++;}});
    A.sf+=as;A.sc+=bs;B.sf+=bs;B.sc+=as;A.jf+=ag;A.jc+=bg;B.jf+=bg;B.jc+=ag;
    if(res.winner===m.home){A.pg++;A.pts++;B.pp++;}else{B.pg++;B.pts++;A.pp++;}
  }));
  return Object.values(rows).sort((a,b)=>b.pts-a.pts || (b.sf-b.sc)-(a.sf-a.sc) || (b.jf-b.jc)-(a.jf-a.jc) || a.team.localeCompare(b.team));
}

function seasonRecords(L){
 const sched=L.schedule||[], played=[]; let total=0;
 sched.forEach((round,r)=>round.forEach((m,i)=>{ total++; const res=getResult(L,r,i); if(res&&res.winner) played.push({r,m,res}); }));
 const T={}; const t=n=>T[n]||(T[n]={streak:0,best:0,bagels:0,comebacks:0,sets:0,games:0});
 played.sort((a,b)=>a.r-b.r).forEach(({m,res})=>{
  const sets=(res.sets||[]).filter(s=>s[0]!==""&&s[1]!=="").map(s=>[+s[0],+s[1]]);
  [[m.home,0],[m.away,1]].forEach(([n,side])=>{
   const o=t(n), win=res.winner===n;
   o.streak=win?o.streak+1:0; o.best=Math.max(o.best,o.streak);
   sets.forEach(s=>{ if(s[side]>s[1-side]) o.sets++; if(s[side]===6&&s[1-side]===0) o.bagels++; o.games+=s[side]; });
   if(win&&sets.length&&sets[0][side]<sets[0][1-side]) o.comebacks++;
  });
 });
 const top=(f)=>{let best=null;Object.entries(T).forEach(([n,o])=>{if(f(o)>0&&(!best||f(o)>f(best[1])))best=[n,o];});return best?{team:best[0],v:f(best[1])}:null;};
 return {played:played.length,total,streak:top(o=>o.streak),bestStreak:top(o=>o.best),bagels:top(o=>o.bagels),comebacks:top(o=>o.comebacks),games:top(o=>o.games)};
}

// --- Reconocimiento flexible de nombres al importar el horario ---
// Antes de mandar el texto al servidor, cada "A vs B" se traduce al nombre
// exacto de la pareja/jugador inscrito. Así vale con escribir "Felix vs
// Federico" (tenis, sin apellidos), "Vega/Lucia", "Grobmeister" o el nombre
// de los jugadores de la pareja aunque falle alguna letra.
const IMPORT_STOP=new Set(["y","e","de","del","la","las","el","los","i","and"]);
function importNorm(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/ß/g,"ss");}
function importTokens(s){return importNorm(s).split(/[^a-z0-9]+/).filter(t=>t&&!IMPORT_STOP.has(t));}
function importTokMatch(a,b){
  if(a===b) return true;
  if(a.length>=3&&b.startsWith(a)) return true;           // "fede" -> "federico"
  if(a.length>=4&&levenshtein(a,b)<=1) return true;      // una letra mal
  if(a.length>=7&&levenshtein(a,b)<=2) return true;      // dos letras en nombres largos
  return false;
}
function importScoreTeam(raw,t,league,relaxed){
  const n=normalizeTeamName(raw), tn=normalizeTeamName(t.team);
  if(!n) return null;
  if(n===tn) return 0;
  if(teamAliasOverrides[league+"|"+n]===t.team) return 0;
  const d=levenshtein(n,tn), thr=(n.length<=4?1:n.length<=8?2:3)+(relaxed?1:0);
  if(d<=thr) return d+(relaxed?5:0);                                    // errata en el nombre
  if(n.length>=4&&tn.length>=4&&(tn.includes(n)||n.includes(tn))) return 3; // coincidencia parcial
  const inT=importTokens(raw);
  if(inT.length){
    const candT=[...importTokens(t.team),...importTokens(t.p1),...importTokens(t.p2)];
    if(inT.every(a=>candT.some(b=>importTokMatch(a,b)))) return 4; // nombres de jugadores
  }
  return null;
}
// Devuelve {liga: {team, score, amb}} con la mejor coincidencia en cada liga.
function importCandidates(raw,relaxed){
  const out={};
  Object.entries(db.leagues).forEach(([k,L])=>{
    let best=null;
    (L.teams||[]).forEach(t=>{
      const sc=importScoreTeam(raw,t,k,relaxed); if(sc===null) return;
      if(!best||sc<best.score) best={team:t.team,score:sc,amb:false};
      else if(sc===best.score&&t.team!==best.team) best.amb=true;
    });
    if(best) out[k]=best;
  });
  return out;
}
function resolveImportPair(a,b,relaxed){
  const A=importCandidates(a,relaxed), B=importCandidates(b,relaxed);
  const opts=Object.keys(A).filter(k=>B[k]&&!A[k].amb&&!B[k].amb&&A[k].team!==B[k].team)
    .map(k=>({k,home:A[k].team,away:B[k].team,score:A[k].score+B[k].score}))
    .sort((x,y)=>x.score-y.score);
  // Si no sale, se prueba con algo más de margen: el rival ya delata la liga.
  if(!opts.length) return relaxed?null:resolveImportPair(a,b,true);
  if(opts.length>1&&opts[1].score===opts[0].score) return {ambiguous:opts.slice(0,3)};
  return opts[0];
}
function preprocessScheduleText(text){
  const changes=[], problems=[];
  const re=/^(.+?)\s+(?:vs\.?|contra|-)\s+(.+?)\s+(\d{1,2}[:.h]\d{2}\b.*)$/i;
  const lines=text.split(/\r?\n/).map(line=>{
    const clean=line.replace(/\*/g,"").trim();
    const m=clean.match(re);
    if(!m||/^jornada\b/i.test(clean)) return line;
    const a=m[1].trim(), b=m[2].trim(), rest=m[3].trim();
    const r=resolveImportPair(a,b);
    if(!r){problems.push(`No reconozco: ${a} vs ${b}`);return clean;}
    if(r.ambiguous){problems.push(`Dudoso: ${a} vs ${b} (podría ser ${r.ambiguous.map(o=>o.home+" vs "+o.away+" en "+db.leagues[o.k].name).join(" o ")})`);return clean;}
    if(r.home!==a||r.away!==b) changes.push(`${a} vs ${b} → ${r.home} vs ${r.away} (${db.leagues[r.k].name})`);
    return `${r.home} vs ${r.away} ${rest}`;
  });
  return {text:lines.join("\n"),changes,problems};
}

function computeBadges(list,name){
 // list: [{m:{home,away}, res}] solo partidos con ganador
 const out=[]; let run=0,best=0,clean=0,comeback=0,wins=0,losses=0;
 list.forEach(x=>{
  const home=x.m.home===name, won=x.res.winner===name;
  if(won){wins++;run++;best=Math.max(best,run)} else {losses++;run=0}
  const sets=(x.res.sets||[]).filter(t=>t[0]!==""&&t[1]!=="").map(t=>home?[+t[0],+t[1]]:[+t[1],+t[0]]);
  if(won&&sets.length&&sets.every(t=>t[0]>t[1])) clean++;
  if(won&&sets.length>=3&&sets[0][0]<sets[0][1]) comeback++;
 });
 if(wins>=1) out.push(["🥇","Primera victoria"]);
 if(best>=3) out.push(["🔥","Racha de "+best]);
 if(list.length>=2&&losses===0) out.push(["✨","Pleno de victorias"]);
 if(clean>=1) out.push(["💎","Ganó sin ceder set"+(clean>1?" ×"+clean:"")]);
 if(comeback>=1) out.push(["💪","Remontada"+(comeback>1?" ×"+comeback:"")]);
 if(list.length>=5) out.push(["🎖️",list.length+" partidos jugados"]);
 return out;
}

function downloadICS(k,home,away){

 const p=n=>String(n).padStart(2,"0");

 const L=db.leagues[k];
 const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Liga Padel ETSII//ES","CALSCALE:GREGORIAN","BEGIN:VEVENT",
  `UID:${k}-${d}-${t}-${Math.abs((home+away).split("").reduce((a,c)=>a*31+c.charCodeAt(0)|0,0))}@padeletsii`,
  `DTSTAMP:${d}T${t}`,`DTSTART;TZID=Europe/Madrid:${d}T${t}`,`DTEND;TZID=Europe/Madrid:${e}`,
  `SUMMARY:${(L?L.name:"Liga")} · ${home} vs ${away}`,`LOCATION:ETSII UPM${si.court?" · "+si.court:""}`,
  "DESCRIPTION:Liga Pádel ETSII","BEGIN:VALARM","TRIGGER:-PT2H","ACTION:DISPLAY","DESCRIPTION:Partido en 2 horas","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
 const blob=new Blob([ics],{type:"text/calendar"}); const a=document.createElement("a");
 a.href=URL.createObjectURL(blob); a.download="partido-liga-etsii.ics"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

function friendlyTimeAgo(iso){
  const d=new Date(iso); if(isNaN(d.getTime())) return "";
  const mins=Math.round((Date.now()-d.getTime())/60000);
  if(mins<1) return "Ahora mismo";
  if(mins<60) return `Hace ${mins} min`;
  const hours=Math.round(mins/60);
  if(hours<24) return `Hace ${hours} h`;
  const days=Math.round(hours/24);
  if(days===1) return "Ayer";
  if(days<7) return `Hace ${days} días`;
  return formatMatchDate(d.toISOString().slice(0,10));
}

function uploadPhoto(input){
 const f=input.files&&input.files[0]; if(!f) return;
 const rd=new FileReader();
 rd.onload=()=>{
  const img=new Image();
  img.onload=async()=>{
   const M=800, sc=Math.min(1,M/Math.max(img.width,img.height)), cv=document.createElement("canvas");
   cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
   cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
   let q=0.72,out=cv.toDataURL("image/jpeg",q);
   while(out.length>300000&&q>0.35){q-=0.1;out=cv.toDataURL("image/jpeg",q)}
   try{
    if(admin){
     await cloudWrite({action:"adminAddPhoto",password:adminPassword,image:out,caption:v("gal_caption")});
     showToast("Foto subida"); 
    }else{
     await cloudWrite({action:"userAddPhoto",username:playerSession.username,token:playerSession.token,image:out,caption:v("gal_caption")});
     showToast("¡Gracias! Tu foto se publicará cuando la revise la organizadora",5000);
    }
    loadGallery();
   }catch(e){alert(e.message)}
  };
  img.src=rd.result;
 };
 rd.readAsDataURL(f);
}

async function saveResult(r,i){
 const L=db.leagues[currentLeague],m=L.schedule[r][i];
 let sets=[[v("s10"),v("s11")],[v("s20"),v("s21")],[v("s30"),v("s31")]];
 let winner=document.getElementById("winner").value;
 if(!winner){
  let a=0,b=0; sets.forEach(s=>{if(s[0]!==""&&s[1]!==""){if(+s[0]>+s[1])a++;else if(+s[1]>+s[0])b++;}});
  winner=a>b?m.home:b>a?m.away:"";
 }
 if(!winner){alert("Indica el ganador o introduce sets suficientes para detectarlo.");return}
 try{
   setSync(false,"Guardando…");
   await cloudWrite({action:"save",password:adminPassword,league:currentLeague,key:resultKey(L,r,i),sets,winner});
   L.results[resultKey(L,r,i)]={sets,winner};
   closeModal();render();setSync(true,"Guardado");
 }catch(e){setSync(false,"Error al guardar");alert(e.message)}
}

async function clearMatchSchedule(r,i){
 const L=db.leagues[currentLeague]; if(!L||!L.schedule||!L.schedule[r]) return;
 const m=L.schedule[r][i]; if(!m) return;
 const si=getMatchSchedule(currentLeague,m.home,m.away);
 const txt=si?[si.date,si.time,si.court].filter(Boolean).join(" · "):"";
 if(!confirm(`¿Quitar el horario de ${m.home} vs ${m.away}${txt?` (${txt})`:""}? El partido seguirá en el calendario, sin día ni hora.`)) return;
 try{
  await cloudWrite({action:"adminClearMatchSchedule",password:adminPassword,league:currentLeague,home:m.home,away:m.away});
  await loadCloudResults(); showToast("Horario quitado");
 }catch(e){alert(e.message)}
}
async function deleteResult(r,i){
 if(!confirm("¿Borrar este resultado?")) return;

 const L = db.leagues[currentLeague];
 const newKey = resultKey(L,r,i);
 const oldKey = legacyResultKey(r,i);

 try{
   setSync(false,"Borrando…");

   await cloudWrite({
     action:"delete",
     password:adminPassword,
     league:currentLeague,
     key:newKey
   });

   if(oldKey !== newKey){
     try{
       await cloudWrite({
         action:"delete",
         password:adminPassword,
         league:currentLeague,
         key:oldKey
       });
     }catch(_){}
   }

   delete L.results[newKey];
   delete L.results[oldKey];

   render();
   setSync(true,"Borrado");
 }catch(e){
   setSync(false,"Error al borrar");
   alert("No se ha podido borrar el resultado: " + e.message);
 }
}

async function playerDashboard(){
 const c=document.getElementById("content");
 if(!playerSession){playerLoginPage();return}
 try{
  const auth={username:playerSession.username,token:playerSession.token};
  const [data]=await Promise.all([
   cloudWrite({action:"playerDashboard",...auth}),
   refreshMyProfile(true),
   refreshInvites(true),
  ]);
  const incoming=data.incoming||[],mine=data.mine||[];
  const k=playerSession.league,L=db.leagues[k];
  const all=localMatchesForPlayer();
  // Identificamos "tu partido" por el enfrentamiento y su fecha/hora real, no
  // por un número de jornada: puede haber varias jornadas jugándose a la vez
  // (partidos aplazados, calendario adelantado, etc.), así que la jornada por
  // sí sola ya no sirve para saber cuál es "el partido de ahora".
  const matchSortKey=(m)=>{
    const d=m.when&&m.when.date;
    if(!d) return [1,0,0,m.round]; // sin fecha asignada todavía: al final, por jornada
    const mins=minutesFromHHMM(m.when.time);
    return [0,daysDiffFromToday(d),mins===null?9999:mins,m.round];
  };
  const cmpByMatch=(a,b)=>{
    const ka=matchSortKey(a),kb=matchSortKey(b);
    for(let i=0;i<ka.length;i++){ if(ka[i]!==kb[i]) return ka[i]-kb[i]; }
    return 0;
  };
  const past=all.filter(m=>m.played).sort((a,b)=>b.round-a.round);
  const upcoming=all.filter(m=>!m.played).sort(cmpByMatch);
  const current=upcoming[0]||null;
  const hasLeague=!!L&&!!L.teams;
  const standingsNow=hasLeague?calcStandings(L):[];
  const stRow=standingsNow.find(x=>x.team===playerSession.team)||{pj:0,pg:0,pp:0};
  const posIdx=standingsNow.findIndex(x=>x.team===playerSession.team);
  const pfWhenChip=(when)=>{
    if(!when||!when.date) return `<span class="pf-chip pf-chip-muted">Fecha por confirmar</span>`;
    const parts=[relativeDayLabel(when.date)]; if(when.time) parts.push(when.time); if(when.court) parts.push(when.court);
    const ts=matchTimestamp(when.date,when.time);
    return `<span class="pf-chip">🗓️ ${esc(parts.join(" · "))}</span>${ts&&ts>Date.now()?` <span class="pf-chip" data-cd="${ts}">⏳ …</span>`:""}`;
  };
  const matchStatusLabel=(m)=>{
    if(!m.when||!m.when.date) return "PENDIENTE";
    if(matchLiveStatus(m.when.date,m.when.time)==="live") return "EN JUEGO";
    if(daysDiffFromToday(m.when.date)===0) return "HOY";
    return "PENDIENTE";
  };
  const matchRow=(m,old=false)=>{
    const won=old&&m.result?.winner===playerSession.team;
    const rowCls=old?(won?"pf-win":"pf-loss"):"";
    const when=m.when&&m.when.date?esc([relativeDayLabel(m.when.date),m.when.time,m.when.court].filter(Boolean).join(" · ")):"Fecha por confirmar";
    const side=old
      ?`<span class="pf-result-pill ${won?"win":"loss"}">${won?"VICTORIA":"DERROTA"}</span><div class="muted" style="font-size:11px;margin-top:4px">${esc(formatScore(m.result))}</div>`
      :`<span class="pf-result-pill pending">${matchStatusLabel(m)}</span>`;
    return `<div class="pf-match-row ${rowCls}"><div class="pf-match-round">J${m.round}</div><div class="pf-match-body"><div class="pf-match-vs">${teamLinkHTML(k,playerSession.team)} <span class="muted" style="font-weight:700">vs</span> ${teamLinkHTML(k,m.opponent)}</div><div class="pf-match-when">${when}</div></div><div class="pf-match-side">${side}</div></div>`;
  };
  const nextEyebrow=current&&current.when&&current.when.date
    ?(matchLiveStatus(current.when.date,current.when.time)==="live"?"🔴 Tu partido · En juego":`Tu partido · ${relativeDayLabel(current.when.date)}`)
    :"Tu próximo partido";
  const keyOf=(h,a)=>stableMatchKey(h,a);
  const waitingMine=new Set(mine.filter(x=>x.status==="pending").map(x=>keyOf(x.home,x.away)));
  const waitingIn=new Set(incoming.map(x=>keyOf(x.home,x.away)));
  const DOW=["DOM","LUN","MAR","MIÉ","JUE","VIE","SÁB"];
  const dayBlock=(m)=>{
    const d=m.when&&m.when.date, mm=String(d||"").match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(!mm) return `<span>J${m.round}</span>`;
    const dt=new Date(+mm[1],+mm[2]-1,+mm[3]);
    return `<span>${DOW[dt.getDay()]}</span><b>${dt.getDate()}</b>`;
  };
  const matchCard=(m)=>{
    const mk=keyOf(m.home,m.away);
    const live=m.when&&m.when.date&&matchLiveStatus(m.when.date,m.when.time)==="live";
    const today=m.when&&m.when.date&&daysDiffFromToday(m.when.date)===0;
    const eyebrow=`Jornada ${m.round}${live?" · 🔴 En juego":today?" · Hoy":""}`;
    const action=waitingIn.has(mk)
      ?`<div class="pf4-wait pf4-wait-in">Tienes un resultado por revisar arriba</div>`
      :waitingMine.has(mk)
        ?`<div class="pf4-wait">Resultado enviado · falta que lo confirme la otra pareja</div>`
        :`<button class="pf4-btn" onclick="openPlayerProposal('${esc(m.key)}')">Proponer resultado</button>`;
    return `<div class="pf4-row"><div class="pf4-date">${dayBlock(m)}</div><div class="pf4-line"></div>
     <div class="pf4-card"><div class="pf4-eb">${esc(eyebrow)}</div>
      <div class="pf4-vs"><b>${teamLinkHTML(k,playerSession.team)}</b> <i>vs</i> <b>${teamLinkHTML(k,m.opponent)}</b></div>
      <div class="pf-next-when">${pfWhenChip(m.when)} ${icsButton(k,m.home,m.away)}</div>
      ${action}</div></div>`;
  };
  const weekGroup=(m)=>{const d=m.when&&m.when.date; if(!d) return 2; return daysDiffFromToday(d)<=7?0:1;};
  const groupTitles=["Esta semana","Más adelante","Sin fecha todavía"];
  const agendaHTML=upcoming.length
    ?[0,1,2].map(g=>{const ms=upcoming.filter(m=>weekGroup(m)===g); return ms.length?`<div class="pf4-wk">${groupTitles[g]}</div>${ms.map(matchCard).join("")}`:""}).join("")
    :`<p class="muted" style="padding:6px 4px">${hasLeague?"No tienes partidos pendientes.":"Tu cuenta es solo de amistosos: aquí verás tus invitaciones. Los partidos de liga son para quienes están inscritos."}</p>`;
  const resultAlerts=incoming.map(x=>{
    const opp=x.home===playerSession.team?x.away:x.home;
    return `<div class="pf4-alert"><div class="pf4-al-top"><span class="pf4-dot"></span><b>${esc(opp)} te propone un resultado</b></div>
     <div class="pf4-al-score">${esc(x.home)} vs ${esc(x.away)}<br><span>${esc(x.score)}</span></div>${autoConfirmNote(x,false)}
     <div class="pf4-al-btns"><button class="pf4-no" onclick="confirmProposal('${esc(x.id)}','reject')">No es correcto</button><button class="pf4-ok" onclick="confirmProposal('${esc(x.id)}','confirm')">Confirmar</button></div></div>`;
  }).join("");
  const inviteAlerts=(invitesCache||[]).filter(i=>i.direction==="received"&&i.status==="pending").slice(0,3).map(i=>
    `<div class="pf4-alert"><div class="pf4-al-top"><span class="pf4-dot"></span><b>${esc(i.otherName)} te invita a jugar</b>${i.sport?` <span class="chip-mini">${esc(i.sport)}</span>`:""}</div>
     <div class="pf4-al-score"><span>“${esc(i.message)}”</span></div>
     <div class="pf4-al-btns"><button class="pf4-ok" onclick="respondInvite('${esc(i.id)}','accept')">✓ Aceptar</button><button class="pf4-no" onclick="respondInvite('${esc(i.id)}','decline')">✕ Rechazar</button></div></div>`).join("");
  const tab=window._pfTab||"partidos";
  const avatarInner=myProfile&&myProfile.avatar?`<img src="${esc(myProfile.avatar)}" alt="">`:esc(initialsOf(playerSession.name));
  const leagueName=esc(L?.name||(k==="amistosos"?"Solo amistosos":k));
  c.innerHTML=`<div class="pf4">
   <div class="pf4-top"><div class="pf4-av" onclick="pfTab('perfil')">${avatarInner}</div><div class="pf4-id"><h2>Mis partidos</h2><div class="pf4-sub">${esc(playerSession.name)}${playerSession.team?" · "+esc(playerSession.team):""}${posIdx>=0&&stRow.pj>0?" · "+(posIdx+1)+"º":""}</div></div><button class="pf4-refresh" onclick="playerDashboard()" title="Actualizar">⟳</button></div>
   ${resultAlerts}${inviteAlerts}
   <div class="pf4-tabs">
    <button class="pf4-tab ${tab==="partidos"?"on":""}" data-tab="partidos" onclick="pfTab('partidos')">Partidos${upcoming.length?` <em>${upcoming.length}</em>`:""}</button>
    <button class="pf4-tab ${tab==="resultados"?"on":""}" data-tab="resultados" onclick="pfTab('resultados')">Resultados${past.length||mine.length?` <em>${past.length+mine.filter(x=>x.status==="pending").length}</em>`:""}</button>
    <button class="pf4-tab ${tab==="perfil"?"on":""}" data-tab="perfil" onclick="pfTab('perfil')">Mi perfil${pendingInviteCount?` <em class="hot">${pendingInviteCount}</em>`:""}</button>
   </div>
   <div class="pf4-pane" data-tab="partidos" ${tab==="partidos"?"":"hidden"}>
    ${reminderHTML(current)}${changesHTML(k,L)}
    ${agendaHTML}
   </div>
   <div class="pf4-pane" data-tab="resultados" ${tab==="resultados"?"":"hidden"}>
    ${mine.length?`<div class="pf4-wk">Resultados que has enviado</div>${mine.map(x=>`<div class="pf4-plain"><b>${esc(x.home)} vs ${esc(x.away)}</b><span>${esc(x.score)} · ${esc(({pending:"pendiente de confirmar",confirmed:"confirmado",rejected:"rechazado"})[x.status]||x.status)}</span>${x.status==="pending"?autoConfirmNote(x,true):""}</div>`).join("")}`:""}
    <div class="pf4-wk">Partidos jugados</div>
    ${past.length?`<div class="pf-match-list">${past.map(m=>matchRow(m,true)).join("")}</div>`:`<p class="muted" style="padding:6px 4px">Todavía no tienes partidos con resultado confirmado.</p>`}
   </div>
   <div class="pf4-pane" data-tab="perfil" ${tab==="perfil"?"":"hidden"}>
    <div class="pf4-me">
     <div class="pf4-bigav" onclick="openAvatarBig(myProfile&&myProfile.avatar,playerSession.name,true)">${avatarInner}</div>
     <div class="pf4-name">${esc(playerSession.name)}</div>
     <div class="pf4-sub2">${playerSession.team?esc(playerSession.team)+" · ":""}${leagueName}</div>
     ${myProfile&&myProfile.bio?`<div class="pf4-bio">“${esc(myProfile.bio)}”</div>`:""}
     ${hasLeague?`<div class="pf4-stats"><div><b>${posIdx>=0?(posIdx+1)+"º":"—"}</b>Posición</div><div><b>${stRow.pj}</b>Jugados</div><div><b>${stRow.pg}</b>Ganados</div><div><b>${upcoming.length}</b>Por jugar</div></div>`:""}
    </div>
    ${hasLeague?(()=>{
      let sw=0,sl=0,gw=0,gl=0,streak=0,wins=0;
      past.slice().sort((a,b)=>a.round-b.round).forEach(m=>{const res=m.result||{};const side=m.home===playerSession.team?0:1;
        (res.sets||[]).filter(s=>s[0]!==""&&s[1]!=="").forEach(s=>{const a=+s[side],b=+s[1-side];gw+=a;gl+=b;if(a>b)sw++;else if(b>a)sl++;});
        const w=res.winner===playerSession.team; if(w){wins++;streak++;}else streak=0;});
      const pct=past.length?Math.round(wins/past.length*100):0;
      return `<div class="pf-stats2"><div class="pf-ring" style="--v:${pct}"><b>${past.length?pct+"%":"–"}</b></div><div class="pf-s2"><div><b>${sw}-${sl}</b><span>sets</span></div><div><b>${gw}-${gl}</b><span>juegos</span></div><div><b>${streak}</b><span>victorias seguidas</span></div></div></div>`;
    })():""}
    ${badgesHTML(computeBadges(past.map(m=>({m:{home:m.home,away:m.away},res:m.result})),playerSession.team))}
    <div class="pf4-menu">
     <button onclick="openEditProfile()"><span>✏️</span>Editar mi perfil<i>›</i></button>
     <button onclick="currentView='info';render()"><span>📸</span>Subir foto a la galería<i>›</i></button>
     <button onclick="openPlayersView()"><span>👥</span>Buscar jugadores<i>›</i></button>
     ${hasLeague?`<button onclick="openContactFinder()"><span>📱</span>Contacto de otras parejas<i>›</i></button>`:""}
     <button class="out" onclick="playerLogout()"><span>⎋</span>Cerrar sesión<i>›</i></button>
    </div>
    <div id="contactFinderResult"></div>
    ${invitesSectionHTML()}
   </div>
  </div>`;
  try{ const ps=document.getElementById("panelSection"); if(ps){ ps.classList.add("panel-bare","panel-nohead"); } }catch(_){}
 }catch(e){
  if(/sesión no válida/i.test(e.message||"")){
   // El token guardado ya no es válido (sesión iniciada en otro sitio, cuenta
   // reverificada, etc.): reintentar con el mismo token solo repetiría el
   // error para siempre, así que cerramos sesión y mostramos el login.
   playerLogout();

const CROP_V=240;
let crop=null; // {img,s,min,ox,oy}
function openEditProfile(){

function pickAvatar(input){
 const f=input.files&&input.files[0]; if(!f) return;
 if(!/^image\//.test(f.type)){alert("Elige una imagen.");return}
 const reader=new FileReader();
 reader.onload=()=>{
  const img=new Image();
  img.onload=()=>{
   const min=CROP_V/Math.min(img.width,img.height);
   crop={img,s:min,min,ox:(CROP_V-img.width*min)/2,oy:(CROP_V-img.height*min)/2};
   const st=document.getElementById("avStage"); if(!st) return;
   st.innerHTML=`<div class="crop-wrap"><canvas id="cropCv" width="${CROP_V}" height="${CROP_V}"></canvas>
    <div class="crop-hint">Arrastra para encuadrar · usa el control para ampliar</div>
    <input type="range" id="cropZoom" min="1" max="4" step="0.01" value="1" aria-label="Zoom">
    <label class="file-btn" style="margin-top:8px">Elegir otra foto<input type="file" accept="image/*" onchange="pickAvatar(this)"></label></div>`;
   initCropEvents(); drawCrop();
  };
  img.onerror=()=>alert("No se ha podido leer esa imagen.");
  img.src=reader.result;
 };
 reader.readAsDataURL(f);
}
function clampCrop(){
 const w=crop.img.width*crop.s,h=crop.img.height*crop.s;
 crop.ox=Math.min(0,Math.max(CROP_V-w,crop.ox)); crop.oy=Math.min(0,Math.max(CROP_V-h,crop.oy));
}
function drawCrop(){
 const cv=document.getElementById("cropCv"); if(!cv||!crop) return;
 const x=cv.getContext("2d"); clampCrop();
 x.clearRect(0,0,CROP_V,CROP_V);
 x.drawImage(crop.img,crop.ox,crop.oy,crop.img.width*crop.s,crop.img.height*crop.s);
 x.fillStyle="rgba(0,0,0,.55)"; x.beginPath(); x.rect(0,0,CROP_V,CROP_V); x.arc(CROP_V/2,CROP_V/2,CROP_V/2-3,0,Math.PI*2,true); x.fill();
 x.strokeStyle="#fff"; x.lineWidth=2; x.beginPath(); x.arc(CROP_V/2,CROP_V/2,CROP_V/2-3,0,Math.PI*2); x.stroke();
}
function initCropEvents(){
 const cv=document.getElementById("cropCv"), z=document.getElementById("cropZoom"); let drag=null;
 cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,ox:crop.ox,oy:crop.oy};cv.setPointerCapture(e.pointerId)});
 cv.addEventListener("pointermove",e=>{if(!drag)return;const r=cv.getBoundingClientRect(),k=CROP_V/r.width;crop.ox=drag.ox+(e.clientX-drag.x)*k;crop.oy=drag.oy+(e.clientY-drag.y)*k;drawCrop()});
 const end=()=>{drag=null}; cv.addEventListener("pointerup",end); cv.addEventListener("pointercancel",end);
 z.addEventListener("input",()=>{
  const old=crop.s, ns=crop.min*(+z.value), c=CROP_V/2;
  crop.ox=c-(c-crop.ox)*(ns/old); crop.oy=c-(c-crop.oy)*(ns/old); crop.s=ns; drawCrop();
 });
}
function exportCrop(){
 // devuelve {full:256px, sm:96px} ya recortados al círculo (cuadrado en JPEG)
 const sx=-crop.ox/crop.s, sy=-crop.oy/crop.s, sw=CROP_V/crop.s;
 const make=(N,max,q0)=>{
  const cv=document.createElement("canvas"); cv.width=cv.height=N; const x=cv.getContext("2d");
  x.fillStyle="#fff"; x.fillRect(0,0,N,N); x.imageSmoothingQuality="high";
  x.drawImage(crop.img,sx,sy,sw,sw,0,0,N,N);
  let q=q0,out=cv.toDataURL("image/jpeg",q);
  while(out.length>max&&q>0.35){q-=0.08;out=cv.toDataURL("image/jpeg",q)}
  return out;
 };
 return {full:make(256,38000,0.88),sm:make(96,11000,0.82)};
}

function waNumber(phone){

  return digits;
}

// Las altas/ediciones de parejas hechas desde "Gestionar inscritos" solo se
// guardan en este navegador (para que tú las veas al momento). Para que las
// vea todo el mundo hay que subir una copia de la página con esos cambios ya
// incorporados: este botón genera esa copia, lista para subir a GitHub Pages.
function buildInitialSnapshot(){
  const leagues={};
  Object.entries(db.leagues).forEach(([k,L])=>{
    const teams=L.teams.map(t=>{
      const o={team:t.team,p1:t.p1,p2:t.p2,paid:t.paid};
      if(t.email) o.email=t.email;
      if(t.phone1) o.phone1=t.phone1;
      if(t.phone2) o.phone2=t.phone2;
      return o;
    });
    const entry={name:L.name,sport:L.sport,complete:!!L.complete,teams};
    if(L.provisional) entry.provisional=true;
    leagues[k]=entry;
  });
  return {leagues,waitlist:INITIAL.waitlist};
}
async function downloadUpdatedSite(){
  if(!admin) return;
  try{
    const res=await fetch(location.href,{cache:"no-store"});
    if(!res.ok) throw new Error("No se ha podido leer la página actual.");
    let html=await res.text();
    if(!/const INITIAL = \{[\s\S]*?\};\n/.test(html) || !/const PLAYER_ROSTER = \[[\s\S]*?\];\n/.test(html)){
      alert("No he encontrado el bloque de datos dentro de la página, así que no puedo generar la copia. Dímelo y lo reviso.");
      return;
    }
    html=html.replace(/const INITIAL = \{[\s\S]*?\};\n/, "const INITIAL = "+JSON.stringify(buildInitialSnapshot())+";\n");
    html=html.replace(/const PLAYER_ROSTER = \[[\s\S]*?\];\n/, "const PLAYER_ROSTER = "+JSON.stringify(PLAYER_ROSTER)+";\n");
    const blob=new Blob([html],{type:"text/html"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="index.html";a.click();URL.revokeObjectURL(a.href);
    alert("Descargado. Sube este archivo en GitHub (Add file → Upload files → Commit changes) para que las altas se vean en la web real.");
  }catch(e){
    alert("No se ha podido generar la copia actualizada desde aquí (esto solo funciona navegando la web ya publicada, no un archivo local). Si lo necesitas, dime qué has añadido y lo subo yo.");
  }
}

  if(!c||lastView!=="standings"||!c.dataset.stLeague) return null;
  const rows=c.querySelectorAll("table tbody tr"); if(!rows.length) return null;
  const map={};
  rows.forEach((tr,i)=>{
    const n=tr.querySelector(".team-link"); if(!n) return;
    const b=tr.querySelector("td:last-child b");
    map[n.dataset.team]={top:tr.getBoundingClientRect().top,pts:b?+b.textContent:0,pos:i};
  });
  return {league:c.dataset.stLeague,map};
}
function render(){
  const snap=snapshotStandings();
  const pv=lastView, pl=lastLeague;
  _render();
  afterRender(snap,pv,pl);
  lastView=currentView; lastLeague=currentLeague;
}
function afterRender(snap,pv,pl){
  try{ const ps=document.getElementById("panelSection"); if(ps){ ps.classList.toggle("panel-bare",currentView==="profile"); ps.classList.toggle("panel-nohead",currentView==="profile"&&!!playerSession&&!!document.querySelector(".pf4")); } }catch(_){}
  const viewChanged=pv!==null&&pv!==currentView, leagueChanged=pl!==null&&pl!==currentLeague&&LIGA_VIEWS.includes(currentView);
  const fresh=viewChanged||leagueChanged||pv===null;
  if(!REDUCED&&(viewChanged||leagueChanged)){
    let dir=1;
    if(viewChanged){ dir=VIEW_ORDER.indexOf(currentView)>=VIEW_ORDER.indexOf(pv)?1:-1; }
    else { const ks=Object.keys(db.leagues); dir=ks.indexOf(currentLeague)>=ks.indexOf(pl)?1:-1; }
    const targets=currentView==="inicio"?[document.getElementById("homePanel")]:[document.getElementById("content")];
    targets.forEach(el=>{
      if(!el) return;
      el.classList.remove("enter-r","enter-l"); void el.offsetWidth;
      el.classList.add(dir>0?"enter-r":"enter-l");
      setTimeout(()=>el.classList.remove("enter-r","enter-l"),400);
    });
  }
  const c=document.getElementById("content");
  if(currentView==="standings"&&c){
    const tbl=c.querySelector("table tbody");
    if(tbl){ c.dataset.stLeague=currentLeague; addShareButton(c); animateStandings(c,snap,fresh); }
    else delete c.dataset.stLeague;
  } else if(c) delete c.dataset.stLeague;
  if(currentView==="cup") animateBracket();
  updateBottomProfile();
}
function posStore(){ try{return JSON.parse(localStorage.getItem("liga_stand_pos")||"{}")}catch(_){return {}} }
const standSession={};
function animateStandings(c,snap,fresh){
  const rows=[...c.querySelectorAll("table tbody tr")];
  const cur=rows.map((tr,i)=>{
    const n=tr.querySelector(".team-link"), b=tr.querySelector("td:last-child b");
    return {tr,name:n?n.dataset.team:"",pos:i,pts:b?+b.textContent:0,ptsEl:b};
  }).filter(r=>r.name);
  // movimiento desde la última visita
  const lg=currentLeague, store=posStore();
  if(!(lg in standSession)) standSession[lg]=store[lg]||null;
  const base=standSession[lg];
  const hasPts=cur.some(r=>r.pts>0);
  if(base&&hasPts){
    cur.forEach(r=>{
      const was=base[r.name]; if(was===undefined) return;
      const d=was-r.pos; if(!d) return;
      const cell=r.tr.querySelector("td.rank"); if(!cell) return;
      cell.insertAdjacentHTML("beforeend",`<span class="mv ${d>0?"up":"down"}" title="Desde tu última visita">${d>0?"▲":"▼"}${Math.abs(d)}</span>`);
    });
  }
  store[lg]=Object.fromEntries(cur.map(r=>[r.name,r.pos]));
  try{localStorage.setItem("liga_stand_pos",JSON.stringify(store))}catch(_){}
  if(REDUCED) return;
  if(fresh||!snap||snap.league!==currentLeague){
    cur.forEach((r,i)=>{
      r.tr.classList.add("st-enter"); r.tr.style.animationDelay=Math.min(i,16)*45+"ms";
      if(r.pts>0&&r.ptsEl) countUp(r.ptsEl,0,r.pts,700+Math.min(i,8)*30);
    });
    return;
  }
  // mismo ranking en pantalla y han llegado datos nuevos: FLIP + cuenta de puntos
  let moved=false;
  cur.forEach(r=>{
    const o=snap.map[r.name]; if(!o) return;
    const dy=o.top-r.tr.getBoundingClientRect().top;
    if(Math.abs(dy)>1){
      moved=true;
      r.tr.style.transition="none"; r.tr.style.transform=`translateY(${dy}px)`;
    }
    if(o.pts!==r.pts){ r.tr.classList.add("st-flash"); countUp(r.ptsEl,o.pts,r.pts,800); }
  });
  if(moved){
    void c.offsetWidth;
    cur.forEach(r=>{ if(r.tr.style.transform){ r.tr.style.transition="transform .75s cubic-bezier(.2,.8,.2,1)"; r.tr.style.transform=""; setTimeout(()=>{r.tr.style.transition=""},800) } });
  }
}
function countUp(el,from,to,ms){
  if(!el||REDUCED||from===to){ if(el) el.textContent=to; return; }
  const s=performance.now();
  (function tick(now){
    const k=Math.min(1,(now-s)/ms), e=1-Math.pow(1-k,3);
    el.textContent=Math.round(from+(to-from)*e);
    if(k<1) requestAnimationFrame(tick);
  })(s);
}

/* ---- próximo partido con cuenta atrás ---- */
function matchTimestamp(date,time){
  const d=String(date||"").match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!d) return null;
  const t=String(time||"").match(/^(\d{1,2}):(\d{2})/);
  if(!t) return null;
  return new Date(+d[1],+d[2]-1,+d[3],+t[1],+t[2]).getTime();
}
function cdCells(ms){
  const t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60,d=Math.floor(h/24);
  const cells=d>0?[[d,"días"],[h%24,"horas"],[m,"min"],[s,"seg"]]:[[h,"horas"],[m,"min"],[s,"seg"]];
  return cells.map(x=>`<div><b>${String(x[0]).padStart(2,"0")}</b><small>${x[1]}</small></div>`).join("");
}
function nextHeroHTML(live,todayRest,upcoming){
  const pick=live[0]||todayRest.find(m=>{const ts=matchTimestamp(m.date,m.time);return ts&&ts>Date.now()})||todayRest[0]||upcoming[0];
  if(!pick) return "";
  const ts=matchTimestamp(pick.date,pick.time);
  const isLive=live.includes(pick);
  const kick=(isLive?"En juego":(daysDiffFromToday(pick.date)===0?"Hoy":"Próximo partido"))+" · "+esc(pick.leagueName);
  const where=[relativeDayLabel(pick.date),pick.court?("Pista "+String(pick.court).replace(/^P/i,"")):""].filter(Boolean).join(" · ");
  const clock=isLive?`<div class="clk live"><b>EN JUEGO</b></div>`:`<div class="clk"><b>${esc(pick.time||"--:--")}</b>${ts&&ts>Date.now()?`<small data-cd="${ts}">⏳</small>`:""}</div>`;
  return `<div class="next-hero"><div class="nh"><span class="k">${kick}</span><span class="wh">${esc(where)}</span></div><div class="sbx"><div class="tms"><div>${teamLinkHTML(pick.league,pick.home)}</div><div>${teamLinkHTML(pick.league,pick.away)}</div></div>${clock}</div><div class="nf">${icsButton(pick.league,pick.home,pick.away)}</div></div>`;
}
setInterval(()=>{

  document.querySelectorAll("[data-cd]").forEach(el=>{

function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
const SHARE_THEMES={
  padel:{bg:["#0C2A6B","#1E5BD8","#0C2A6B"],accent:"#F2B82E",text:"#fff",sub:"rgba(255,255,255,.7)",row:"rgba(255,255,255,.12)"},
  tenis:{bg:["#b84400","#e8600a","#ff9a4d"],accent:"#fff3d6",text:"#fff",sub:"rgba(255,255,255,.78)",row:"rgba(255,255,255,.16)"}
};
function shareFont(){return "Montserrat, Archivo, Inter, Arial, sans-serif"}
function drawStandingsPanel(x,L,ox,oy,w,th,opt){
  // dibuja una clasificación completa (o las `max` primeras) en un panel
  const F=shareFont(), st=calcStandings(L).slice(0,opt.max||99), rh=opt.rh||52;
  x.textAlign="left"; x.fillStyle=th.accent; x.font=`900 ${opt.title||44}px ${F}`;
  x.fillText(L.name.toUpperCase(),ox,oy);
  x.fillStyle=th.sub; x.font=`700 ${Math.round((opt.title||44)*.45)}px ${F}`;
  x.fillText("CLASIFICACIÓN"+(L.provisional?" PROVISIONAL":""),ox,oy+Math.round((opt.title||44)*.7));
  const y0=oy+Math.round((opt.title||44)*1.1);
  st.forEach((t,i)=>{
    const y=y0+i*rh;
    x.fillStyle=th.row; rrect(x,ox-14,y,w+28,rh-8,14); x.fill();
    x.fillStyle=i<3?th.accent:th.text; x.font=`900 ${rh*.52}px ${F}`; x.textAlign="left"; x.fillText(String(i+1),ox+8,y+rh*.66);
    x.font=`800 ${rh*.48}px ${F}`; let nm=t.team; const maxW=w-210;
    while(x.measureText(nm).width>maxW&&nm.length>3) nm=nm.slice(0,-2);
    if(nm!==t.team) nm+="…"; x.fillText(nm,ox+(rh*.95),y+rh*.66);
    x.fillStyle=th.sub; x.font=`700 ${rh*.36}px ${F}`; x.textAlign="right"; x.fillText(`${t.pg}G ${t.pp}P`,ox+w-90,y+rh*.64);
    x.fillStyle=i<3?th.accent:th.text; x.font=`900 ${rh*.56}px ${F}`; x.fillText(String(t.pts),ox+w,y+rh*.67);
    x.textAlign="left";
  });
  return y0+st.length*rh;
}
function themeFor(L){const k=Object.keys(db.leagues).find(q=>db.leagues[q]===L), P=SHARE_PAL[SHARE_CAT[k]||"gen"]; return {bg:[P[0],P[1],P[0]],accent:P[2],text:"#fff",sub:"rgba(255,255,255,.7)",row:"rgba(255,255,255,.12)"};}
function paintBg(x,W,H,th){
  const g=x.createLinearGradient(0,0,W*.4,H); g.addColorStop(0,th.bg[0]); g.addColorStop(.6,th.bg[1]); g.addColorStop(1,th.bg[2]);
  x.fillStyle=g; x.fillRect(0,0,W,H);
}
async function buildShareImage(L,k){
  try{ await document.fonts.load("900 40px Archivo"); }catch(_){}
  const th=themeFor(L), W=1080, n=Math.min(10,L.teams.length), H=Math.max(1000,380+n*92+170);
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H; const x=cv.getContext("2d"), F=shareFont();
  paintBg(x,W,H,th);
  x.fillStyle=th.accent; x.font=`900 30px ${F}`; x.fillText("LIGA "+(L.sport==="Tenis"?"TENIS":"PÁDEL")+" ETSII · 2026/27",70,110);
  const yEnd=drawStandingsPanel(x,L,70,200,W-140,th,{max:10,rh:92,title:78});
  x.fillStyle=th.accent; x.font=`900 28px ${F}`; x.fillText("padeletsii.github.io",70,Math.max(yEnd+70,H-70));
  return await new Promise(res=>cv.toBlob(res,"image/png"));
}
// Exportación de la administradora: todas las ligas de pádel en una imagen y el tenis aparte
async function buildAllPadelImage(){
  try{ await document.fonts.load("900 40px Archivo"); }catch(_){}
  const th=SHARE_THEMES.padel, F=shareFont();
  const leagues=Object.entries(db.leagues).filter(([k,L])=>L.sport!=="Tenis"&&L.teams.length);
  const rh=46, colW=980, gap=90, pad=80, cols=2;
  const rows=Math.ceil(leagues.length/cols);
  const heightOf=(L)=>Math.round(44*1.1)+L.teams.length*rh+60;
  const rowH=[];for(let r=0;r<rows;r++){rowH.push(Math.max(...leagues.slice(r*cols,r*cols+cols).map(([k,L])=>heightOf(L))))}
  const W=pad*2+colW*cols+gap*(cols-1), H=200+rowH.reduce((a,b)=>a+b,0)+rows*20+110;
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H; const x=cv.getContext("2d");
  paintBg(x,W,H,th);
  x.fillStyle=th.accent; x.font=`900 40px ${F}`; x.fillText("LIGA PÁDEL ETSII · 2026/27",pad,100);
  x.fillStyle=th.text; x.font=`900 78px ${F}`; x.fillText("CLASIFICACIONES",pad,180);
  let oy=290;
  for(let r=0;r<rows;r++){
    leagues.slice(r*cols,r*cols+cols).forEach(([k,L],c)=>{ drawStandingsPanel(x,L,pad+c*(colW+gap),oy,colW,th,{rh,title:44}); });
    oy+=rowH[r]+20;
  }
  x.fillStyle=th.accent; x.font=`900 30px ${F}`; x.fillText("padeletsii.github.io",pad,H-50);
  return await new Promise(res=>cv.toBlob(res,"image/png"));
}

   else if(y<lastY-4 || y<60) nav.classList.remove("bn-hide");
  }
  lastY=y;ticking=false;
 }

})();
