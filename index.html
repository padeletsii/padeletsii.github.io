<style>
:root{
  --blue:#164f9e; --blue2:#0d376f; --cream:#f4efe3; --paper:#fffdf8;
  --gold:#d6ad4b; --ink:#18202a; --muted:#6c7480; --line:#ded9cf;
  --green:#2c7a5a; --red:#b73c3c; --shadow:0 14px 40px rgba(20,40,70,.10);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--cream);color:var(--ink)}
button,input,select{font:inherit}
header{background:linear-gradient(135deg,var(--blue2),var(--blue));color:white;padding:28px 22px 22px}
.wrap{max-width:1180px;margin:auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand-left{display:flex;align-items:center;gap:17px;min-width:0}

@media(max-width:700px){.brand-left{gap:10px}}
.brand h1{margin:0;font-size:clamp(28px,5vw,52px);letter-spacing:-.04em;line-height:.95}
.brand p{margin:8px 0 0;opacity:.78}
.badge{border:1px solid rgba(255,255,255,.35);padding:8px 12px;border-radius:999px;font-weight:800;font-size:12px;letter-spacing:.08em}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
nav button,.league-tabs button{border:0;border-radius:999px;padding:10px 15px;cursor:pointer;font-weight:800}
nav button{background:rgba(255,255,255,.12);color:#fff}
nav button.active{background:#fff;color:var(--blue)}
main{padding:24px 18px 70px}
.league-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.league-tabs button{background:#e7e1d5;color:#4c5560}
.league-tabs button.active{background:var(--blue);color:#fff}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.panel-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;align-items:center}
.panel-head h2{margin:0;font-size:22px}
.panel-head small{color:var(--muted)}
.content{padding:20px 22px}
.notice{background:#fff6d9;border:1px solid #ead28d;border-radius:14px;padding:13px 15px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;min-width:720px}
.table-scroll{overflow:auto}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;padding:10px 9px;border-bottom:1px solid var(--line)}
th:nth-child(1),th:nth-child(2),td:nth-child(1),td:nth-child(2){text-align:left}
td{padding:12px 9px;border-bottom:1px solid #eee9df;text-align:right}
tr:last-child td{border-bottom:0}
.rank{font-weight:900;width:44px}
.team{font-weight:800;cursor:pointer}
.team:hover{text-decoration:underline}
.team-link{appearance:none;border:0;background:transparent;color:inherit;padding:0;font:inherit;font-weight:800;text-align:left;cursor:pointer}
.team-link:hover{text-decoration:underline;color:var(--blue)}
.team-link:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:3px}
.top3 .rank{color:var(--gold)}
.top8{background:rgba(22,79,158,.035)}
.journey-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:14px}
.journey{border:1px solid var(--line);border-radius:16px;padding:15px;background:#fff}
.journey h3{margin:0 0 12px;color:var(--blue);font-size:16px}
.match{padding:10px 0;border-top:1px solid #eee9df}
.match:first-of-type{border-top:0}
.match-line{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.match-line .away{text-align:right}
.score{font-weight:900;min-width:62px;text-align:center}
.pending{color:var(--muted);font-weight:700}
.played{color:var(--blue)}
.admin-btn{position:fixed;right:18px;bottom:18px;border:0;background:var(--ink);color:#fff;border-radius:999px;padding:12px 17px;font-weight:900;box-shadow:var(--shadow);cursor:pointer}
.adminbar{display:none;background:#151b22;color:#fff;padding:13px 18px}
.adminbar.on{display:block}
.adminbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px}
.adminbar button,.primary,.secondary,.danger{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}
.primary{background:var(--blue);color:#fff}.secondary{background:#e7e1d5;color:#252b32}.danger{background:#7f2525;color:#fff}
.admin-edit{display:none;margin-top:8px}
.admin-mode .admin-edit{display:flex;gap:6px;flex-wrap:wrap}
.admin-edit button{font-size:12px;border:0;border-radius:8px;padding:6px 8px;background:#e9edf3;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(10,18,30,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal.open{display:flex}
.modal-card{background:var(--paper);width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:20px;padding:22px;box-shadow:0 24px 80px rgba(0,0,0,.25)}
.modal-card h3{margin-top:0}
.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:900;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%;padding:11px;border:1px solid #cbc6bc;border-radius:10px;background:white}
.setrow{display:grid;grid-template-columns:1fr 24px 1fr;gap:7px;align-items:center;margin:7px 0}
.setrow input{text-align:center}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:16px;padding:15px;background:#fff}
.card h3{margin:0 0 5px;font-size:16px}.card p{margin:4px 0;color:var(--muted)}
.cup{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:28px;overflow:auto;padding-bottom:8px}
.round h3{color:var(--blue)}
.slot{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin:10px 0;min-height:48px}
.muted{color:var(--muted)}

.team-profile-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:16px}
.team-profile-head h3{margin:0 0 5px;font-size:24px}.members{color:var(--muted);line-height:1.55}
.position-box{text-align:center;background:#eef3fa;border:1px solid #d5dfec;border-radius:14px;padding:10px 14px;min-width:92px}
.position-box strong{display:block;font-size:28px;color:var(--blue);line-height:1}.position-box span{font-size:11px;font-weight:900;text-transform:uppercase;color:var(--muted)}
.profile-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 18px}
.profile-stat{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:#fff}
.profile-stat strong{display:block;font-size:19px}.profile-stat span{font-size:11px;color:var(--muted);font-weight:800}
.streak-wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 18px}
.streak-label{font-size:12px;text-transform:uppercase;font-weight:900;color:var(--muted)}
.streak{display:flex;gap:6px;flex-wrap:wrap}
.form-dot{width:23px;height:23px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:white;font-size:11px;font-weight:900}
.form-dot.win{background:#2d8a57}.form-dot.loss{background:#c94b4b}
.form-dot.latest{position:relative;box-shadow:0 0 0 2px var(--paper),0 0 0 4px #d6ad4b}
.form-dot.latest::after{content:"";position:absolute;inset:-7px;border:1px solid rgba(214,173,75,.22);border-radius:50%;pointer-events:none}

function deepClone(x){return JSON.parse(JSON.stringify(x))}
function roundRobin(teams){
  let a=teams.map(t=>t.team);
  if(a.length%2) a.push("DESCANSA");
  const n=a.length, rounds=[];
  let arr=[...a];
  for(let r=0;r<n-1;r++){
    let ms=[];
    for(let i=0;i<n/2;i++){
      let x=arr[i], y=arr[n-1-i];
      if(x!=="DESCANSA" && y!=="DESCANSA"){
        if(r%2===0) ms.push({home:x,away:y}); else ms.push({home:y,away:x});
      }
    }
    rounds.push(ms);
    arr=[arr[0],arr[n-1],...arr.slice(1,n-1)];
  }
  return rounds;
}
function initDB(){
  const d=deepClone(INITIAL);
  for(const [key,L] of Object.entries(d.leagues)){
    L.results={};
    if(L.complete){
      L.schedule=roundRobin(L.teams);
    }else L.schedule=[];
  }
  return d;
}
function setSync(ok,text){
  const el=document.getElementById("syncStatus");
  if(!el)return;
  el.className="sync-status "+(ok?"ok":"bad");
  el.textContent=text;
}
function apiReady(){return API_URL && !API_URL.includes("PEGA_AQUI")}
let cloudLoadInFlight=false;
async function loadCloudResults(){
  if(!apiReady()){setSync(false,"Falta conectar");render();return}
  // Si ya hay una petición en marcha (por ejemplo el refresco automático de 30s
  // solapándose con una recarga manual), no lanzamos otra por encima: así nunca
  // se acumulan peticiones y "Actualizando…" no se queda colgado por eso.
  if(cloudLoadInFlight) return;
  cloudLoadInFlight=true;
  const ctrl=new AbortController();
  const killTimer=setTimeout(()=>ctrl.abort(),15000);
  try{
    setSync(false,"Actualizando…");
    const r=await fetch(API_URL+"?action=state&t="+Date.now(),{cache:"no-store",signal:ctrl.signal});
    const data=await r.json();
    if(!data.ok) throw new Error(data.error||"Error");
    for(const L of Object.values(db.leagues)) L.results={};

    const incoming=data.results||[];
    if(data.currentRounds) currentRounds=Object.assign(currentRounds,data.currentRounds);

    // Primero cargamos las claves antiguas (0-1, 1-2, etc.) y las traducimos
    // a la identidad real del partido según el calendario actual.
    incoming.forEach(x=>{
      const L=db.leagues[x.league];
      if(!L) return;
      const mm=String(x.key||"").match(/^(\d+)-(\d+)$/);
      if(mm){
        const r=Number(mm[1]), i=Number(mm[2]);
        const match=L.schedule?.[r]?.[i];
        if(match){
          const k=stableMatchKey(match.home,match.away);
          L.results[k]={sets:x.sets||[],winner:x.winner};
        }
      }
    });

    // Después cargamos las claves permanentes. Si un partido ya fue migrado,
    // la versión nueva prevalece sobre la antigua.
    incoming.forEach(x=>{
      const L=db.leagues[x.league];
      if(!L) return;
      if(String(x.key||"").startsWith("v2:")){
        L.results[x.key]={sets:x.sets||[],winner:x.winner};
      }
    });

    // Horario de partidos (fecha, hora, pista), importado por la administradora
    // desde el panel de administración sin tocar el código fuente.
    matchSchedule={};
    (data.schedule||[]).forEach(x=>{
      if(!x||!x.league||!x.home||!x.away) return;
      matchSchedule[scheduleMapKey(x.league,x.home,x.away)]={date:x.date||"",time:x.time||"",court:x.court||"",jornada:x.jornada||0};
    });
    setSync(true,"Actualizado");
    render();
  }catch(e){
    console.error(e);
    setSync(false,e.name==="AbortError"?"Tardó demasiado, reintentando…":"Sin conexión");
  }finally{
    clearTimeout(killTimer);
    cloudLoadInFlight=false;
  }
}
async function cloudWrite(payload){
  if(!apiReady()) throw new Error("La web todavía no está conectada al backend.");
  const body=new URLSearchParams();
  Object.entries(payload).forEach(([k,v])=>body.append(k,typeof v==="string"?v:JSON.stringify(v)));
  const r=await fetch(API_URL,{method:"POST",body});
  const data=await r.json();
  if(!data.ok) throw new Error(data.error||"No se pudo guardar");
  return data;
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function stableMatchKey(home,away){
  // La clave no depende de la jornada ni del orden visual del calendario.
  // Ordenamos los nombres para que A-vs-B y B-vs-A sean el mismo partido.
  const pair=[String(home),String(away)].sort((a,b)=>a.localeCompare(b,"es",{sensitivity:"base"}));
  return "v2:"+encodeURIComponent(pair[0])+"||"+encodeURIComponent(pair[1]);
}
function resultKey(L,r,m){
  const match=L.schedule?.[r]?.[m];
  if(!match) return "";
  return stableMatchKey(match.home,match.away);
}
function legacyResultKey(r,m){return r+"-"+m}
function getResult(L,r,m){
  // Compatibilidad temporal: primero la clave nueva y, si aún no existe,
  // la antigua. Así no se pierden los resultados ya introducidos.
  return L.results?.[resultKey(L,r,m)] || L.results?.[legacyResultKey(r,m)] || null;
}
function scheduleMapKey(league,home,away){return league+"|"+stableMatchKey(home,away);}
function getMatchSchedule(league,home,away){return matchSchedule[scheduleMapKey(league,home,away)]||null;}
function formatMatchDate(iso){
  const mm=String(iso||"").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!mm) return "";
  const y=Number(mm[1]),mo=Number(mm[2]),d=Number(mm[3]);
  const dt=new Date(y,mo-1,d);
  const dias=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  return `${dias[dt.getDay()]} ${d}/${mo}`;
}
function initialsOf(name){
  return String(name||"").trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase();
}
function matchWhenHTML(si){
  if(!si||!si.date) return "";
  const parts=[formatMatchDate(si.date)]; if(si.time) parts.push(si.time); if(si.court) parts.push(si.court);
  return `<div class="muted" style="font-size:12px;margin:0 0 4px">${esc(parts.join(" · "))}</div>`;
}

function calcStandings(L){
  let rows={};
  L.teams.forEach(t=>rows[t.team]={team:t.team,pj:0,pg:0,pp:0,pts:0,sf:0,sc:0,jf:0,jc:0});
  (L.schedule||[]).forEach((round,r)=>round.forEach((m,i)=>{
    const res=getResult(L,r,i); if(!res||!res.winner)return;
    let A=rows[m.home],B=rows[m.away]; A.pj++;B.pj++;
    let as=0,bs=0,ag=0,bg=0;
    (res.sets||[]).forEach(s=>{let x=Number(s[0]),y=Number(s[1]);if(Number.isFinite(x)&&Number.isFinite(y)){ag+=x;bg+=y;if(x>y)as++;else if(y>x)bs++;}});
    A.sf+=as;A.sc+=bs;B.sf+=bs;B.sc+=as;A.jf+=ag;A.jc+=bg;B.jf+=bg;B.jc+=ag;
    if(res.winner===m.home){A.pg++;A.pts++;B.pp++;}else{B.pg++;B.pts++;A.pp++;}
  }));
  return Object.values(rows).sort((a,b)=>b.pts-a.pts || (b.sf-b.sc)-(a.sf-a.sc) || (b.jf-b.jc)-(a.jf-a.jc) || a.team.localeCompare(b.team));
}

function localMatchesForPlayer(){
  if(!playerSession)return [];
  const k=playerSession.league,L=db.leagues[k];
  if(!L)return [];
  const schedule=scheduleForLeague(L),out=[];
  schedule.forEach((round,r)=>round.forEach((m,i)=>{
    if(m.home===playerSession.team||m.away===playerSession.team){
      const res=getResult(L,r,i);
      out.push({
        league:k,round:r+1,key:resultKey(L,r,i),home:m.home,away:m.away,
        opponent:m.home===playerSession.team?m.away:m.home,
        isHome:m.home===playerSession.team,result:res,played:!!res?.winner,
        when:getMatchSchedule(k,m.home,m.away)
      });
    }
  }));
  return out;
}

 let matches=[], form=[];
 (L.schedule||[]).forEach((round,r)=>round.forEach((m,i)=>{
   if(m.home===name||m.away===name){
     const res=getResult(L,r,i);
     const opponent=m.home===name?m.away:m.home;
     let outcome="";
     if(res?.winner){

     matches.push({r,m,res,opponent,outcome,when:getMatchSchedule(k,m.home,m.away)});
   }
 }));
 const played=matches.filter(x=>x.res?.winner);
 const pending=matches.filter(x=>!x.res?.winner);
 const recentForm=[...form].reverse();
 const streak=recentForm.length

 const playedHTML=played.length?played.map(x=>profileMatchHTML(x,name)).join(""):`<p class="muted">Todavía no hay partidos jugados.</p>`;

 openModal(`

 </div>
 <div class="profile-stats">
   <div class="profile-stat"><strong>${st.pj}</strong><span>Jugados</span></div>
   <div class="profile-stat"><strong>${st.pg}</strong><span>Ganados</span></div>
   <div class="profile-stat"><strong>${st.pp}</strong><span>Perdidos</span></div>
   <div class="profile-stat"><strong>${pending.length}</strong><span>Por jugar</span></div>
 </div>
 <div class="streak-wrap"><span class="streak-label">Racha</span>${streak}</div>
 <div class="profile-section"><h4>Partidos jugados</h4>${playedHTML}</div>
 <div class="profile-section"><h4>Próximos partidos · ${pending.length}</h4>${pendingHTML}</div>
 <div class="actions"><button class="secondary" onclick="closeModal()">Cerrar</button></div>`);
}

async function saveResult(r,i){
 const L=db.leagues[currentLeague],m=L.schedule[r][i];
 let sets=[[v("s10"),v("s11")],[v("s20"),v("s21")],[v("s30"),v("s31")]];
 let winner=document.getElementById("winner").value;
 if(!winner){
  let a=0,b=0; sets.forEach(s=>{if(s[0]!==""&&s[1]!==""){if(+s[0]>+s[1])a++;else if(+s[1]>+s[0])b++;}});
  winner=a>b?m.home:b>a?m.away:"";
 }
 if(!winner){alert("Indica el ganador o introduce sets suficientes para detectarlo.");return}
 try{
   setSync(false,"Guardando…");
   await cloudWrite({action:"save",password:adminPassword,league:currentLeague,key:resultKey(L,r,i),sets,winner});
   L.results[resultKey(L,r,i)]={sets,winner};
   closeModal();render();setSync(true,"Guardado");
 }catch(e){setSync(false,"Error al guardar");alert(e.message)}
}

async function deleteResult(r,i){
 if(!confirm("¿Borrar este resultado?")) return;

 const L = db.leagues[currentLeague];
 const newKey = resultKey(L,r,i);
 const oldKey = legacyResultKey(r,i);

 try{
   setSync(false,"Borrando…");

   await cloudWrite({
     action:"delete",
     password:adminPassword,
     league:currentLeague,
     key:newKey
   });

   if(oldKey !== newKey){
     try{
       await cloudWrite({
         action:"delete",
         password:adminPassword,
         league:currentLeague,
         key:oldKey
       });
     }catch(_){}
   }

   delete L.results[newKey];
   delete L.results[oldKey];

   render();
   setSync(true,"Borrado");
 }catch(e){
   setSync(false,"Error al borrar");
   alert("No se ha podido borrar el resultado: " + e.message);
 }
}

function waNumber(phone){
  let digits=String(phone||"").replace(/\D/g,"");
  if(!digits)return "";
  if(digits.startsWith("00"))digits=digits.slice(2);
  if(digits.length===9)digits="34"+digits;
  return digits;
}

async function submitPlayerProposal(){const m=window._playerMatches[+v("pmatch")];const sets=[[v("ps10"),v("ps11")],[v("ps20"),v("ps21")],[v("ps30"),v("ps31")]].filter(x=>x[0]!==""&&x[1]!=="").map(x=>x.map(Number));if(sets.length<2){alert("Introduce al menos dos sets.");return}try{await cloudWrite({action:"proposeResult",username:playerSession.username,token:playerSession.token,league:m.league,key:m.key,home:m.home,away:m.away,sets});alert("Resultado propuesto. Solo será oficial cuando lo confirme un usuario verificado de la pareja rival.");closeModal();currentView="profile";render()}catch(e){alert(e.message)}}
async function renderAdminProposals(){
 const c=document.getElementById("content");
 document.getElementById("panelTitle").textContent="Resultados propuestos";
 document.getElementById("panelSub").textContent="Propuestas enviadas por los jugadores";
 c.innerHTML=`<p class="muted">Cargando propuestas…</p>`;
 try{
  const data=await cloudWrite({action:"adminProposals",password:adminPassword});
  const rows=data.proposals||[];
  c.innerHTML=rows.length?`<div class="admin-list">${rows.map(p=>`<div class="proposal-card"><div class="proposal-admin-head"><div><span class="status-pill ${p.status==="confirmed"?"status-ok":p.status==="pending"?"status-wait":"status-none"}">${esc(p.status==="confirmed"?"Confirmado":p.status==="pending"?"Pendiente":"Rechazado")}</span><b>${esc(p.leagueName)}</b></div><small>${esc(p.created_at||"")}</small></div><h4>${esc(p.home)} vs ${esc(p.away)}</h4><div class="proposal-admin-score">${esc(p.score||"Sin marcador")}</div><div class="muted">Propuesto por <b>@${esc(p.proposer_username||"")}</b> · ${esc(p.proposer_team||"")}${p.confirmed_by?` · confirmado por @${esc(p.confirmed_by)}`:""}</div><div class="actions">${p.status==="pending"?`<button onclick="adminResolveProposal('${esc(p.id)}','confirm')">✓ Confirmar</button>`:""}<button class="danger" onclick="adminResolveProposal('${esc(p.id)}','delete')">🗑 Eliminar</button></div></div>`).join("")}</div>`:`<div class="notice">Todavía no hay resultados propuestos.</div>`;
 }catch(e){c.innerHTML=`<div class="notice">${esc(e.message)}</div>`}
}
async function adminResolveProposal(id,decision){
 if(decision==="delete" && !confirm("¿Seguro que quieres eliminar este resultado propuesto? No se puede deshacer."))return;
 try{
  await cloudWrite({action:"adminResolveProposal",password:adminPassword,id,decision});
  await loadCloudResults();
  renderAdminProposals();
 }catch(e){alert(e.message)}
}

async function renderUsersPage(){
 const c=document.getElementById("content");
 document.getElementById("panelTitle").textContent="Usuarios";
 document.getElementById("panelSub").textContent="Cuentas de jugadores y solicitudes pendientes";
 c.innerHTML=`<p class="muted">Cargando usuarios…</p>`;
 try{
  const data=await cloudWrite({action:"adminUsers",password:adminPassword,roster:PLAYER_ROSTER});
  const s=data.summary||{},rows=data.players||[],req=data.requests||[];
  c.innerHTML=`<div class="user-summary"><div><b>${s.verified||0}</b>Verificados</div><div><b>${s.pending||0}</b>Pendientes</div><div><b>${s.missing||0}</b>Sin registrar</div><div><b>${s.coveredTeams||0}/${s.totalTeams||0}</b>Parejas cubiertas</div></div>
  ${req.length?`<h4>Solicitudes pendientes</h4>${req.map(r=>`<div class="proposal-card"><b>${esc(r.name)}</b><br><span class="muted">${esc(r.team)} · ${esc(r.leagueName||r.league)} · <b>@${esc(r.username||"")}</b></span><div class="actions"><button onclick="adminVerifyUser('${esc(r.id)}','verify')">✓ Verificar</button><button class="danger" onclick="adminVerifyUser('${esc(r.id)}','reject')">✕ Rechazar</button></div></div>`).join("")}`:"<p class='muted'>No hay solicitudes pendientes.</p>"}
  <h4 style="margin-top:24px">Todos los jugadores</h4><div class="table-scroll"><table class="user-table"><thead><tr><th>Jugador</th><th>Usuario</th><th>Pareja</th><th>Liga</th><th>Estado</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${r.username?`@${esc(r.username)}`:"—"}</td><td>${esc(r.team)}</td><td>${esc(r.leagueName)}</td><td><span class="status-pill ${r.status==="Verificado"?"status-ok":r.status==="Pendiente"?"status-wait":"status-none"}">${esc(r.status)}</span></td></tr>`).join("")}</tbody></table></div>`;
 }catch(e){c.innerHTML=`<div class="notice">${esc(e.message)}</div>`}
}

async function showUserAdmin(){
 if(!admin){alert("Entra primero en modo administrador.");return}openModal(`<h3>Usuarios</h3><p class="muted">Cargando…</p>`);
 try{const data=await cloudWrite({action:"adminUsers",password:adminPassword,roster:PLAYER_ROSTER});const s=data.summary||{},rows=data.players||[];openModal(`<h3>Usuarios de la liga</h3><div class="user-summary"><div><b>${s.verified||0}</b>Verificados</div><div><b>${s.pending||0}</b>Pendientes</div><div><b>${s.missing||0}</b>Sin registrar</div><div><b>${s.coveredTeams||0}/${s.totalTeams||0}</b>Parejas cubiertas</div></div>${(data.requests||[]).length?`<h4>Solicitudes pendientes</h4>${data.requests.map(r=>`<div class="proposal-card"><b>${esc(r.name)}</b><br><span class="muted">${esc(r.team)} · ${esc(r.leagueName||r.league)} · @${esc(r.username)}</span><div class="actions"><button onclick="adminVerifyUser('${esc(r.id)}','verify')">✓ Verificar</button><button class="danger" onclick="adminVerifyUser('${esc(r.id)}','reject')">✕ Rechazar</button></div></div>`).join("")}`:"<p class='muted'>No hay solicitudes pendientes.</p>"}<h4>Seguimiento de jugadores</h4><div class="table-scroll"><table class="user-table"><thead><tr><th>Jugador</th><th>Pareja</th><th>Liga</th><th>Estado</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.team)}</td><td>${esc(r.leagueName)}</td><td><span class="status-pill ${r.status==="Verificado"?"status-ok":r.status==="Pendiente"?"status-wait":"status-none"}">${esc(r.status)}</span></td></tr>`).join("")}</tbody></table></div>`)}catch(e){openModal(`<h3>Usuarios</h3><div class="notice">${esc(e.message)}</div>`)}
}
async function adminVerifyUser(id,decision){try{await cloudWrite({action:"verifyUser",password:adminPassword,id,decision});if(currentView==="users")renderUsersPage();else showUserAdmin()}catch(e){alert(e.message)}}

async function validateAdminPassword(p){
 if(!p) return false;
 try{
   await cloudWrite({action:"analytics",password:p,period:"total"});
   return true;
 }catch(_){
   return false;
 }
}
async function toggleAdmin(force){
 if(force===false){
   admin=false;adminPassword="";
   try{sessionStorage.removeItem(ADMIN_SESSION_KEY)}catch(_){}
   document.getElementById("adminbar").classList.remove("on");document.body.classList.remove("admin-mode");
   if(currentView==="adminProposals"||currentView==="users")currentView="standings";render();return;
 }
 if(!admin){
   const p=prompt("Clave de administrador:");
   if(p===null||!p)return;
   const ok=await validateAdminPassword(p);
   if(!ok){alert("Contraseña de administrador incorrecta.");return}
   adminPassword=p;admin=true;
   try{sessionStorage.setItem(ADMIN_SESSION_KEY,p)}catch(_){}
   document.getElementById("adminbar").classList.add("on");document.body.classList.add("admin-mode");
 }else{
   admin=false;adminPassword="";
   try{sessionStorage.removeItem(ADMIN_SESSION_KEY)}catch(_){}
   document.getElementById("adminbar").classList.remove("on");document.body.classList.remove("admin-mode");
   if(currentView==="adminProposals"||currentView==="users")currentView="standings";
 }
 render();
}
async function restoreAdminSession(){
 let p="";
 try{p=sessionStorage.getItem(ADMIN_SESSION_KEY)||""}catch(_){}
 if(!p) return;
 if(await validateAdminPassword(p)){
   adminPassword=p;admin=true;
   document.getElementById("adminbar").classList.add("on");document.body.classList.add("admin-mode");
   render();
 }else{
   try{sessionStorage.removeItem(ADMIN_SESSION_KEY)}catch(_){}
 }
}
function analyticsVisitorId(){
 try{
   let id=localStorage.getItem("padel_etsii_visitor_id");
   if(!id){id=(crypto.randomUUID?crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(36).slice(2)));localStorage.setItem("padel_etsii_visitor_id",id)}
   return id;
 }catch(_){return "anon-"+Date.now().toString(36)}
}
function trackEvent(eventName){
 if(!apiReady()) return;
 const body=new URLSearchParams({action:"track",event:eventName,visitor:analyticsVisitorId()});
 fetch(API_URL,{method:"POST",body,keepalive:true}).catch(()=>{});
}
async function showAnalytics(period="total"){
 if(!admin){alert("Entra primero en modo administrador.");return}
 openModal(`<h3>Estadísticas</h3><p class="muted">Cargando…</p>`);
 try{
   const data=await cloudWrite({action:"analytics",password:adminPassword,period});
   const a=data.analytics||{};
   const label=period==="today"?"Hoy":period==="7d"?"Últimos 7 días":"Total";
   openModal(`<h3>Estadísticas</h3>
     <div class="stats-period">
       <button class="${period==="today"?"active":""}" onclick="showAnalytics('today')">Hoy</button>
       <button class="${period==="7d"?"active":""}" onclick="showAnalytics('7d')">7 días</button>
       <button class="${period==="total"?"active":""}" onclick="showAnalytics('total')">Total</button>
     </div>
     <p class="muted">${label} · los visitantes únicos son aproximados por navegador.</p>
     <div class="stats-grid">
       <div class="stat-card"><div class="stat-number">${a.visits||0}</div><div class="stat-label">Visitas</div></div>
       <div class="stat-card"><div class="stat-number">${a.unique||0}</div><div class="stat-label">Visitantes únicos</div></div>
       <div class="stat-card"><div class="stat-number">${a.info||0}</div><div class="stat-label">Clics en Info</div></div>
       <div class="stat-card"><div class="stat-number">${a.instagram_velasco9||0}</div><div class="stat-label">Clics en @velasco9_</div></div>
       <div class="stat-card"><div class="stat-number">${a.instagram_cdindustriales||0}</div><div class="stat-label">Clics en @cdindustriales</div></div>
     </div>`);
 }catch(e){openModal(`<h3>Estadísticas</h3><div class="notice">${esc(e.message)}</div>`)}
}
function exportData(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="liga-etsii-backup.json";a.click();URL.revokeObjectURL(a.href);
}
function importData(e){
 const f=e.target.files[0];if(!f)return;
 const rd=new FileReader();rd.onload=()=>{try{db=JSON.parse(rd.result);saveDB();render();alert("Copia importada.");}catch(err){alert("Archivo no válido.")}};rd.readAsText(f);
}
trackEvent("visit");
render();
loadCloudResults();
restoreAdminSession();
setInterval(()=>{if(!admin)loadCloudResults()},30000);
</script>
