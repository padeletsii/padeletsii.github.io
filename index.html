<script id="identidad-etsii-js">
/* =====================================================================
   IDENTIDAD LIGAS ETSII — capa visual (JS). Solo decora: lee el estado
   que ya maneja la web (currentView, currentLeague, playerSession) y
   pinta colores y logo. No cambia datos ni llamadas a la API.
   ===================================================================== */
(function () {
  var LEAGUE_CAT = { pro: "padel", media: "padel", fem: "padel", mixta: "padel", tenis: "tenis" };
  var FILE = { padel: "padel", tenis: "tenis-o" };
  var BALL = { padel: [58.77, 30.70], tenis: [59.55, 30.70] };
  var DOTS = { masc: ["#1F6BEA", "#3FDED6"], fem: ["#E81E7C", "#F98BBE"], mix: ["#6A2EF0", "#DCF23A"], tenis: ["#5B22E0", "#C9E13A"], gen: ["#1E5BD8", "#F2B82E"] };
  var THEME = { padel: "#CCFF00", tenis: "#C24A00" };
  var REDUCE = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var root = document.documentElement;
  var cat = null, emblem = null, busy = false;

  function catOfLeague(k) { return LEAGUE_CAT[k] || "padel"; }
  function pageCat() {
    try {
      var ligaViews = (typeof LIGA_VIEWS !== "undefined") ? LIGA_VIEWS : ["standings", "matches", "teams", "cup"];
      if (ligaViews.indexOf(currentView) >= 0 || currentView === "adminProposals") return catOfLeague(currentLeague);
      if (currentView === "profile" && playerSession && playerSession.league) return catOfLeague(playerSession.league);
    } catch (e) {}
    return "padel";
  }

  // precarga
  Object.keys(BALL).forEach(function (k) { new Image().src = "identidad/" + FILE[k] + ".webp"; new Image().src = "identidad/" + FILE[k] + "-ball.webp"; });

  // ---------- logo por piezas ----------
  function buildEmblem() {
    var host = document.querySelector("header .brand-left");
    if (!host || document.getElementById("idEmblem")) return;
    emblem = document.createElement("div");
    emblem.className = "id-emblem scatter instant"; emblem.id = "idEmblem";
    emblem.setAttribute("role", "img"); emblem.setAttribute("aria-label", "Logo de la liga");
    var N = 10, CX = 49, CY = 51;
    function pt(deg, r) { var a = deg * Math.PI / 180; return (CX + r * Math.cos(a)).toFixed(2) + "% " + (CY + r * Math.sin(a)).toFixed(2) + "%"; }
    for (var k = 0; k <= N; k++) {
      var s = document.createElement("div"); s.className = "sl";
      var i = document.createElement("i"), clip, mid = 0, t, p = [];
      if (k === N) { for (var d = 0; d < 360; d += 20) p.push(pt(d, 17)); clip = "polygon(" + p.join(",") + ")"; }
      else {
        var a0 = k * 360 / N - 90 - 0.8, a1 = a0 + 360 / N + 1.6; mid = (a0 + a1) / 2;
        var outer = [], inner = [];
        for (t = 0; t <= 4; t++) outer.push(pt(a0 + (a1 - a0) * t / 4, 80));
        for (t = 4; t >= 0; t--) inner.push(pt(a0 + (a1 - a0) * t / 4, 16));
        clip = "polygon(" + outer.concat(inner).join(",") + ")";
      }
      var dist = k === N ? 0 : 10 + (k % 3) * 6, rad = mid * Math.PI / 180;
      i.style.cssText = "--clip:" + clip + ";--tx:" + (Math.cos(rad) * dist).toFixed(1) + "px;--ty:" + (Math.sin(rad) * dist).toFixed(1) +
        "px;--r:" + (k === N ? 0 : (k % 2 ? 1 : -1) * (12 + (k % 4) * 6)) + "deg;--delay:" + (k === N ? 0 : 30 + ((k * 3) % N) * 34) + "ms";
      s.appendChild(i); emblem.appendChild(s);
    }
    var ball = document.createElement("div"); ball.className = "ball gone"; ball.innerHTML = '<img alt="">';
    emblem.appendChild(ball);
    emblem.addEventListener("click", function () { assemble(false); });
    host.insertBefore(emblem, host.firstChild);
  }
  function paintEmblem() {
    if (!emblem) return;
    emblem.querySelectorAll(".sl i").forEach(function (i) { i.style.backgroundImage = "url(identidad/" + FILE[cat] + ".webp)"; });
    emblem.style.setProperty("--bx", BALL[cat][0] + "%"); emblem.style.setProperty("--by", BALL[cat][1] + "%");
    emblem.querySelector(".ball img").src = "identidad/" + FILE[cat] + "-ball.webp";
  }
  function assemble(swap) {
    if (!emblem) return;
    var ball = emblem.querySelector(".ball");
    function go() {
      emblem.classList.add("instant"); emblem.classList.remove("exit"); emblem.classList.add("scatter");
      if (swap) paintEmblem();
      void emblem.offsetWidth; emblem.classList.remove("instant");
      requestAnimationFrame(function () { emblem.classList.remove("scatter"); });
      setTimeout(function () { ball.className = "ball drop"; busy = false; }, REDUCE ? 0 : 520);
    }
    ball.className = "ball gone";
    if (swap && !REDUCE) { emblem.classList.add("exit"); setTimeout(go, 400); } else go();
  }

  // ---------- título según el deporte ----------
  function paintTitle() {
    var h1 = document.querySelector("header .brand h1");
    if (!h1) return;
    var want = cat === "tenis" ? "LIGA TENIS<br>ETSII" : "LIGA PÁDEL<br>ETSII";
    if (h1.innerHTML !== want) h1.innerHTML = want;
  }

  function flood() {
    if (REDUCE) return;
    var f = document.getElementById("idFlood");
    if (!f) { f = document.createElement("div"); f.id = "idFlood"; f.className = "id-flood"; document.body.appendChild(f); }
    var h = document.querySelector("header"), r = h ? h.getBoundingClientRect() : { left: 0, top: 0, width: innerWidth, height: 0 };
    f.style.setProperty("--fx", (r.left + 60) + "px"); f.style.setProperty("--fy", (r.top + r.height / 2) + "px");
    f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
  }

  // ---------- aplicar categoría ----------
  function applyCat() {
    var next = pageCat();
    if (next === cat) return;
    var first = cat === null;
    cat = next; root.setAttribute("data-cat", cat);
    var tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.setAttribute("content", THEME[cat]);
    paintTitle();
    if (first) { paintEmblem(); assemble(false); }
    else { assemble(true); }
  }

  // ---------- decorar elementos que pinta la web ----------
  function decorate() {
    // puntos de color en las pestañas de liga
    try {
      var keys = Object.keys(db.leagues);
      document.querySelectorAll("#leagueTabs button").forEach(function (b, idx) {
        var c = catOfLeague(keys[idx]); b.setAttribute("data-lk", keys[idx]);
      });
    } catch (e) {}
    // cada partido del inicio lleva el color de su liga
    document.querySelectorAll(".livenow-match, .next-hero").forEach(function (el) {
      var tl = el.querySelector(".team-link[data-league]");
      if (tl) { var c = catOfLeague(tl.getAttribute("data-league")); if (el.getAttribute("data-lc") !== c) el.setAttribute("data-lc", c); }
    });
  }

  // clasificación en el móvil: lista compacta en vez de la tabla ancha
  function mobileStandings() {
    var c = document.getElementById("content");
    if (!c || currentView !== "standings") return;
    var tbl = c.querySelector("table.st-table");
    if (!tbl) return;
    var L = db.leagues[currentLeague]; if (!L) return;
    var st = calcStandings(L);
    var sig = currentLeague + "|" + JSON.stringify(st.map(function (x) { return [x.team, x.pts, x.pj, x.sf, x.sc]; }));
    var old = c.querySelector(".st-mobile");
    if (old && old.getAttribute("data-sig") === sig) return;
    if (old) old.remove();
    var tennis = L.sport === "Tenis", k = currentLeague;
    var rows = st.map(function (x, i) {
      var cls = (i < 8 ? "in" : "") + (i < 3 ? " top" : "") + (i === 8 ? " cut" : "");
      var me = (typeof playerSession !== "undefined" && playerSession && playerSession.league === k && playerSession.team === x.team) ? " me" : "";
      var sub = x.pj ? ("sets " + x.sf + "-" + x.sc) : "Sin partidos todavía";
      return '<li class="' + cls + me + '"><span class="pos">' + (i + 1) + '</span><div class="nm">' + teamLinkHTML(k, x.team) + '<small>' + sub + '</small></div><span class="pj">' + x.pj + '</span><b class="pt">' + x.pts + '</b></li>';
    }).join("");
    var wrap = document.createElement("div");
    wrap.className = "st-mobile"; wrap.setAttribute("data-sig", sig);
    wrap.innerHTML = '<div class="st-h"><span>#</span><span>' + (tennis ? "Jugador" : "Pareja") + '</span><span>PJ</span><span>PTS</span></div><ol>' + rows + '</ol><p class="st-note">Las 8 primeras ' + (tennis ? "posiciones" : "parejas") + ' (resaltadas) pasan a la copa.</p>';
    var scroll = c.querySelector(".table-scroll") || tbl;
    scroll.parentNode.insertBefore(wrap, scroll);
  }

  // ---------- comparativa al tocar un partido ----------
  function formOf(L, team) {
    var out = [];
    (L.schedule || []).forEach(function (round, r) { round.forEach(function (m, i) {
      if (m.home !== team && m.away !== team) return;
      var res = getResult(L, r, i); if (!res || !res.winner) return;
      out.push(res.winner === team ? "W" : "L");
    }); });
    return out.slice(-5);
  }
  function findMatch(L, a, b) {
    var hit = null;
    (L.schedule || []).forEach(function (round, r) { round.forEach(function (m, i) {
      if ((m.home === a && m.away === b) || (m.home === b && m.away === a)) hit = { r: r, i: i, m: m };
    }); });
    return hit;
  }
  function openCompare(k, a, b) {
    var L = db.leagues[k]; if (!L) return;
    var st = calcStandings(L), pos = {};
    st.forEach(function (x, i) { pos[x.team] = { i: i + 1, x: x }; });
    var f = findMatch(L, a, b); if (!f) return;
    var h = f.m.home, w = f.m.away, H = pos[h], A = pos[w]; if (!H || !A) return;
    var res = getResult(L, f.r, f.i), played = !!(res && res.winner);
    var si = typeof getMatchSchedule === "function" ? getMatchSchedule(k, h, w) : null;
    var sets = played ? (res.sets || []).filter(function (s) { return s[0] !== "" && s[1] !== ""; }) : [];
    var pct = function (o) { return o.pj ? Math.round(o.pg / o.pj * 100) : 0; };
    var n = L.teams.length;
    var lines = [
      ["Posición", H.i + "º", A.i + "º", (n - H.i + 1), (n - A.i + 1), H.i < A.i ? 1 : H.i > A.i ? 2 : 0],
      ["Puntos", H.x.pts, A.x.pts, H.x.pts, A.x.pts, 0],
      ["Partidos jugados", H.x.pj, A.x.pj, H.x.pj, A.x.pj, -1],
      ["% victorias", pct(H.x) + "%", pct(A.x) + "%", pct(H.x), pct(A.x), 0],
      ["Sets ganados", H.x.sf, A.x.sf, H.x.sf, A.x.sf, 0],
      ["Juegos ganados", H.x.jf, A.x.jf, H.x.jf, A.x.jf, 0]
    ];
    var rows = lines.map(function (l) {
      var best = l[5]; if (best === 0) best = l[3] > l[4] ? 1 : l[4] > l[3] ? 2 : 0; if (best === -1) best = 0;
      var tot = (l[3] + l[4]) || 1;
      return '<div class="cr"><span class="v' + (best === 1 ? " best" : "") + '">' + l[1] + '</span><div class="mid"><span>' + l[0] + '</span><div class="bars"><i><b style="width:' + (l[3] / tot * 100) + '%"></b></i><i><b style="width:' + (l[4] / tot * 100) + '%"></b></i></div></div><span class="v' + (best === 2 ? " best" : "") + '">' + l[2] + '</span></div>';
    }).join("");
    var form = function (t) { var x = formOf(L, t); while (x.length < 5) x.unshift("N"); return '<span class="form">' + x.map(function (c) { return '<i class="' + c + '">' + (c === "W" ? "G" : c === "L" ? "P" : "") + '</i>'; }).join("") + '</span>'; };
    var sc = function (side) { return played ? '<span class="sc">' + sets.map(function (s) { return '<span class="' + (+s[side] > +s[1 - side] ? "w" : "") + '">' + s[side] + '</span>'; }).join("") + '</span>' : ""; };
    var when = played ? "Resultado confirmado" : (si && si.date ? esc([relativeDayLabel(si.date), si.time, si.court].filter(Boolean).join(" · ")) : "Fecha por confirmar");
    var tennis = L.sport === "Tenis";
    var html = '<div class="cmp' + (tennis ? " is-tenis" : "") + '">' +
      '<div class="cmp-top"><span class="cmp-lg">' + esc(L.name) + ' · Jornada ' + (f.r + 1) + '</span><button class="cmp-x" onclick="closeModal()" aria-label="Cerrar">✕</button></div>' +
      '<div class="board"><div class="row2' + (played && res.winner !== h ? " lose" : "") + '"><span class="ps">' + H.i + 'º</span><span class="nm">' + esc(h) + '</span>' + sc(0) + '</div>' +
      '<div class="row2' + (played && res.winner !== w ? " lose" : "") + '"><span class="ps">' + A.i + 'º</span><span class="nm">' + esc(w) + '</span>' + sc(1) + '</div>' +
      '<div class="bfoot"><span>' + when + '</span><span>' + (played ? "Gana <b>" + esc(res.winner) + "</b>" : "") + '</span></div></div>' +
      '<div class="cmp-rows">' + rows + '<div class="cr fr">' + form(h) + '<div class="mid"><span>Últimos 5</span></div>' + form(w) + '</div></div>' +
      '<div class="cmp-act"><button class="secondary" data-cmp-team="' + esc(h) + '">Ficha de ' + esc(h) + '</button><button class="secondary" data-cmp-team="' + esc(w) + '">Ficha de ' + esc(w) + '</button></div></div>';
    openModal(html);
    var card = document.getElementById("modalCard");
    card.querySelectorAll("[data-cmp-team]").forEach(function (btn) { btn.addEventListener("click", function () { closeModal(); showTeam(k, btn.getAttribute("data-cmp-team")); }); });
  }
  document.addEventListener("click", function (e) {
    var box = e.target.closest(".match, .livenow-match, .next-hero, .pf4-card");
    if (!box) return;
    if (e.target.closest(".admin-edit, .match-share, .pf4-btn, .cal-btn, .ics-btn, a, input, select, .pf4-wait")) return;
    if (e.target.closest("button") && !e.target.closest(".team-link")) return;
    var links = box.querySelectorAll(".team-link[data-team]");
    if (links.length < 2) return;
    var k = links[0].getAttribute("data-league") || currentLeague;
    e.preventDefault(); e.stopPropagation();
    openCompare(k, links[0].getAttribute("data-team"), links[1].getAttribute("data-team"));
  }, true);

  function shareMini() {
    var head = document.querySelector("#panelSection .panel-head"); if (!head) return;
    var has = document.querySelector("#content > .share-btn") && currentView === "standings";
    var btn = head.querySelector(".share-mini");
    if (!has) { if (btn) btn.remove(); return; }
    if (btn) return;
    btn = document.createElement("button"); btn.type = "button"; btn.className = "share-mini"; btn.setAttribute("aria-label", "Compartir clasificación como imagen");
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg><span>Compartir</span>';
    btn.addEventListener("click", function () { shareStandings(); });
    head.appendChild(btn);
  }

  var queued = false;
  function refresh() {
    if (queued) return; queued = true;
    requestAnimationFrame(function () { queued = false; applyCat(); decorate(); try { mobileStandings(); } catch (e) {} try { shareMini(); } catch (e) {} });
  }

  // envolvemos render() sin cambiar lo que hace
  if (typeof render === "function") {
    var _render0 = render;
    render = function () { var out = _render0.apply(this, arguments); document.body.classList.remove("tennis-theme"); refresh(); return out; };
  }
  // y vigilamos cambios que no pasan por render() (cuenta atrás, cargas de la nube)
  function observe() {
    ["liveNow", "content", "leagueTabs"].forEach(function (id) {
      var el = document.getElementById(id);

  }
  function boot() { buildEmblem(); observe(); refresh(); }

})();

</script>
